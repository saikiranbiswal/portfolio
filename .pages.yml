# Pages CMS configuration — https://pagescms.org
# This file lets you log in at app.pagescms.org with GitHub and edit your
# portfolio's content visually. Saving in the CMS commits to this repo, which
# redeploys the live site automatically. No export / push by hand anymore.
#
# Covered here: Work (products.json), About (about.json), Contact (contact.json).
# Labs (labs.json) is intentionally NOT here yet — its "features" are stored as
# arrays-of-arrays and need a small data migration before a visual CMS can edit
# them. That's the documented phase-2 task.

media:
  # Where uploaded images land in the repo, and the path written into content.
  # Kept relative (no leading slash) so it works on a GitHub Pages project site.
  input: assets/screenshots
  output: assets/screenshots

content:
  # ----------------------------------------------------------------- WORK ----
  - name: products
    label: "Work — Projects"
    type: file
    path: content/products.json
    fields:
      - name: meta
        label: Site identity
        type: object
        fields:
          - { name: owner, label: Owner name, type: string }
          - { name: role, label: Role line, type: string }
          - { name: glyph, label: Logo glyph, type: string }
          - { name: email, label: Email, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: linkedinLabel, label: LinkedIn label, type: string }
          - { name: location, label: Location, type: string }
          - { name: resume, label: Résumé path, type: string }
          - { name: status, label: Availability status, type: string }
          - { name: showRoleOnCards, label: Show role on cards, type: boolean }
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - { name: id, label: ID (slug, no spaces), type: string }
          - { name: name, label: Name, type: string }
          - { name: description, label: Description, type: text }
          - { name: tags, label: Tags, type: string, list: true }
          - { name: role, label: Role, type: string }
          - { name: year, label: Year, type: string }
          - { name: stage, label: Stage, type: string }
          - { name: screenshot, label: Screenshot, type: image }
          - { name: path, label: App folder path, type: string }
          - name: displayMode
            label: Open as
            type: select
            options:
              - page
              - modal
          - { name: featured, label: Featured (flagship), type: boolean }

  # ---------------------------------------------------------------- ABOUT ----
  - name: about
    label: "About page"
    type: file
    path: content/about.json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading (HTML allowed), type: string }
          - { name: lead, label: Lead, type: text }
          - { name: paras, label: Paragraphs, type: text, list: true }
      - { name: timelineEyebrow, label: Timeline eyebrow, type: string }
      - { name: timelineCount, label: Timeline subtitle, type: string }
      - name: timeline
        label: Timeline
        type: object
        list: true
        fields:
          - { name: yr, label: Years, type: string }
          - { name: h4, label: Title, type: string }
          - { name: org, label: Organisation, type: string }
          - { name: p, label: Description, type: text }
      - { name: principlesEyebrow, label: Principles eyebrow, type: string }
      - { name: principlesCount, label: Principles subtitle, type: string }
      - name: principles
        label: Operating principles
        type: object
        list: true
        fields:
          - { name: n, label: Number, type: string }
          - { name: h4, label: Title, type: string }
          - { name: p, label: Text, type: text }
      - { name: skillsEyebrow, label: Skills eyebrow, type: string }
      - { name: skillsCount, label: Skills subtitle, type: string }
      - name: skills
        label: Skill columns
        type: object
        list: true
        fields:
          - { name: h, label: Column heading, type: string }
          - { name: items, label: Items, type: string, list: true }
      - name: cta
        label: Call to action
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: btn, label: Button text, type: string }

  # -------------------------------------------------------------- CONTACT ----
  - name: contact
    label: "Contact page"
    type: file
    path: content/contact.json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading (HTML allowed), type: string }
          - { name: body, label: Body, type: text }
      - name: links
        label: Contact links
        type: object
        list: true
        fields:
          - { name: k, label: Label, type: string }
          - { name: v, label: Value, type: string }
          - { name: type, label: "Type (email / resume — optional)", type: string }
          - { name: href, label: "URL (optional)", type: string }
          - { name: external, label: Opens in new tab, type: boolean }
