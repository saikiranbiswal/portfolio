function calc(d=state.draft){const rc=state.rateCards[d.city][d.package];const base=d.area*rc.expected;const scope=d.addons.filter(x=>x.selected&&x.included).reduce((a,b)=>a+(+b.amount||0),0)+(d.customAddons||[]).filter(x=>x.included).reduce((a,b)=>a+(+b.amount||0),0);const subtotal=base+scope;const contingency=subtotal*d.contingency/100;const margin=(subtotal+contingency)*d.margin/100;const taxable=subtotal+contingency+margin;const gst=d.gstEnabled?taxable*d.gst/100:0;const discount=taxable*d.discount/100;const final=taxable+gst-discount;return{rc,base,scope,subtotal,contingency,margin,taxable,gst,discount,final,effective:d.area?final/d.area:0}}
function wizard(){const d=state.draft,c=calc(d);const steps=['Customer','Project','Package','Scope','Commercials','Review'];return `<div class="page-head"><div><h2>Create a new quote</h2><p>Six guided steps from lead details to a customer-ready quotation.</p></div><button class="btn" onclick="saveDraft()">Save draft</button></div>${trust()}<div class="stepper">${steps.map((s,i)=>`<button class="step ${d.step===i+1?'active':d.step>i+1?'done':''}" onclick="setStep(${i+1})">${i+1}. ${s}</button>`).join('')}</div><div class="wizard-layout"><section class="card pad">${wizardStep(d,c)}</section>${liveSummary(d,c)}</div>`}
function wizardStep(d,c){if(d.step===1)return `<h3>Customer details</h3><p class="muted">Who will receive and approve this quotation?</p><div class="form-grid"><div class="field"><label>Customer name *</label><input class="input draft-input" data-k="customer" value="${esc(d.customer)}"></div><div class="field"><label>Phone number *</label><input class="input draft-input" data-k="phone" value="${esc(d.phone)}"></div><div class="field"><label>Email (optional)</label><input class="input draft-input" data-k="email" value="${esc(d.email)}"></div><div class="field"><label>Customer type</label><select class="input draft-input" data-k="customerType"><option>Homeowner lead</option><option>Developer</option><option>Architect referral</option></select></div><div class="field"><label>Lead source</label><select class="input draft-input" data-k="leadSource"><option>Referral</option><option>WhatsApp</option><option>Site board</option><option>Digital campaign</option></select></div><div class="field"><label>Project address / locality</label><input class="input draft-input" data-k="address" value="${esc(d.address)}"></div></div>${wizardButtons()}`;
if(d.step===2)return `<h3>Project details</h3><p class="muted">The physical parameters that determine the rate-card calculation.</p><div class="form-grid"><div class="field"><label>City *</label><select class="input draft-input" data-k="city">${cities.map(x=>`<option ${x===d.city?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Locality zone</label><input class="input draft-input" data-k="locality" value="${esc(d.locality)}"></div><div class="field"><label>Built-up area (sq.ft.) *</label><input class="input draft-input" data-k="area" type="number" value="${d.area}"></div><div class="field"><label>Floors</label><select class="input draft-input" data-k="floors">${['Ground only','G+1','G+2','G+3'].map(x=>`<option ${x===d.floors?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Plot type</label><input class="input draft-input" data-k="plotType" value="${esc(d.plotType)}"></div><div class="field"><label>Construction type</label><select class="input draft-input" data-k="constructionType"><option>New construction</option><option>Extension</option><option>Reconstruction</option></select></div><div class="field"><label>Expected start date</label><input class="input draft-input" data-k="startDate" type="date" value="${d.startDate}"></div><div class="field"><label>Expected timeline</label><input class="input draft-input" data-k="timeline" value="${esc(d.timeline)}"></div></div>${wizardButtons()}`;
if(d.step===3)return `<h3>Select a package</h3><p class="muted">Rates below come only from the ${esc(d.city)} rate card.</p><div class="grid cols-2" style="margin:16px 0">${packages.map(p=>{const r=state.rateCards[d.city][p];return `<div class="card package ${p===d.package?'selected':''}" onclick="choosePackage('${p}')"><div class="row" style="justify-content:space-between"><h4>${p}</h4>${badge(confidenceLabel(confidenceScore(r),r.status))}</div><div class="rate">${money(r.expected)} <span class="small muted">/ sq.ft.</span></div><div class="range">Min ${money(r.min)} · Expected ${money(r.expected)} · Max ${money(r.max)}</div><p class="small muted">${esc(r.labourNotes)}</p></div>`}).join('')}</div><div class="alert"><b>Selected package scope:</b> ${esc(c.rc.included.join(', '))}. Excludes ${esc(c.rc.excluded.slice(0,4).join(', '))} and other listed exclusions.</div>${wizardButtons()}`;
if(d.step===4)return `<h3>Scope adjustments</h3><p class="muted">Include optional work as fixed line items. These amounts are contractor-entered, never AI-generated.</p><div style="margin-top:15px">${d.addons.map((a,i)=>`<div class="check-row"><input type="checkbox" ${a.selected?'checked':''} onchange="toggleAddon(${i},this.checked)"><span>${esc(a.name)}</span><input class="input amount" type="number" value="${a.amount}" placeholder="Amount" onchange="setAddonAmount(${i},this.value)"></div>`).join('')}</div><div class="row" style="margin-top:15px"><input class="input" id="customName" placeholder="Custom line item name" style="flex:1"><input class="input" id="customAmount" type="number" placeholder="Amount" style="width:160px"><button class="btn" onclick="addCustomAddon()">Add line item</button></div>${d.customAddons.map((a,i)=>`<div class="check-row"><span>${esc(a.name)}</span><span class="money" style="margin-left:auto">${money(a.amount)}</span><button class="btn sm danger" onclick="removeCustom(${i})">Remove</button></div>`).join('')}${wizardButtons()}`;
if(d.step===5)return `<h3>Commercials</h3><p class="muted">Apply contractor-controlled commercial rules after scope.</p><div class="form-grid"><div class="field"><label>Margin %</label><input class="input draft-input" data-k="margin" type="number" value="${d.margin}"></div><div class="field"><label>Contingency %</label><input class="input draft-input" data-k="contingency" type="number" value="${d.contingency}"></div><div class="field"><label>Discount %</label><input class="input draft-input" data-k="discount" type="number" value="${d.discount}"></div><div class="field"><label>Validity period (days)</label><input class="input draft-input" data-k="validity" type="number" value="${d.validity}"></div><div class="field"><label>GST %</label><input class="input draft-input" data-k="gst" type="number" value="${d.gst}"></div><div class="field"><label>GST treatment</label><div class="check-row"><input type="checkbox" id="gstEnabled" ${d.gstEnabled?'checked':''} onchange="setGst(this.checked)"><span>${d.gstEnabled?'GST applied':'GST off by default'}</span></div></div></div><h4>Payment milestone template</h4><div class="table-wrap"><table><tbody>${d.milestones.map(m=>`<tr><td>${m[0]}</td><td style="text-align:right"><b>${m[1]}%</b></td><td style="text-align:right">${money(c.final*m[1]/100)}</td></tr>`).join('')}</tbody></table></div>${wizardButtons()}`;
return `<h3>Review & generate</h3><p class="muted">Verify the pricing source, assumptions and final amount before generating.</p>${c.rc.status==='draft'?`<div class="alert red" style="margin:15px 0"><b>This rate card is not approved.</b> Verify before sending a customer quote.</div>`:''}<div class="formula">Rate card × Area + Scope adjustments + Contingency + Margin + GST − Discount<br>${money(c.rc.expected)} × ${Number(d.area).toLocaleString('en-IN')} + ${money(c.scope)} + ${money(c.contingency)} + ${money(c.margin)} + ${money(c.gst)} − ${money(c.discount)}</div><div style="margin-top:14px">${breakdown(c)}</div><div class="alert" style="margin-top:14px"><b>Assumptions:</b> ${esc(state.templates.assumptions)}<br><br><b>Exclusions:</b> ${esc(c.rc.excluded.join(', '))}</div>${wizardButtons(true)}`}
function wizardButtons(generate=false){return `<div class="row" style="justify-content:space-between;margin-top:24px"><button class="btn" onclick="prevStep()" ${state.draft.step===1?'disabled':''}>Back</button><button class="btn primary" onclick="${generate?'generateQuote()':'nextStep()'}">${generate?'Generate quote':'Save & continue'}</button></div>`}
function liveSummary(d,c){return `<aside class="card pad summary"><div class="summary-total"><span>Live quote amount</span><strong>${money(c.final)}</strong><div>${money(c.effective)} / sq.ft. effective</div></div><div class="kv"><span>City</span><b>${esc(d.city)}</b></div><div class="kv"><span>Package</span><b>${esc(d.package)}</b></div><div class="kv"><span>Area / floors</span><b>${Number(d.area).toLocaleString('en-IN')} · ${esc(d.floors)}</b></div><div class="kv"><span>Base rate</span><b>${money(c.rc.expected)}</b></div><div class="kv"><span>Base amount</span><b>${money(c.base)}</b></div><div class="kv"><span>Contingency</span><b>${money(c.contingency)}</b></div><div class="kv"><span>Margin</span><b>${money(c.margin)}</b></div><div class="kv"><span>GST</span><b>${money(c.gst)}</b></div><div class="kv"><span>Validity</span><b>${d.validity} days</b></div><div class="kv"><span>Rate-card status</span>${badge(c.rc.status)}</div><p class="small muted" style="margin-bottom:0">Calculated from selected local rate card. AI did not generate this price.</p></aside>`}
function breakdown(c){return `<div class="kv"><span>Base amount</span><b>${money(c.base)}</b></div><div class="kv"><span>Scope adjustments</span><b>${money(c.scope)}</b></div><div class="kv"><span>Contingency</span><b>${money(c.contingency)}</b></div><div class="kv"><span>Margin</span><b>${money(c.margin)}</b></div><div class="kv"><span>Taxable amount</span><b>${money(c.taxable)}</b></div><div class="kv"><span>GST</span><b>${money(c.gst)}</b></div><div class="kv"><span>Discount</span><b>− ${money(c.discount)}</b></div><div class="kv" style="font-size:17px"><span><b>Final quote amount</b></span><b>${money(c.final)}</b></div>`}
function afterRender(){document.querySelectorAll('.draft-input').forEach(el=>el.addEventListener('change',e=>{const k=e.target.dataset.k;state.draft[k]=e.target.type==='number'?+e.target.value:e.target.value;if(k==='city'){state.draft.package='Standard Turnkey';const rc=state.rateCards[state.draft.city][state.draft.package];state.draft.margin=rc.margin;state.draft.contingency=rc.contingency}save();render()}))}
function setStep(n){state.draft.step=n;save();render()}function nextStep(){if(state.draft.step===1&&(!state.draft.customer||!state.draft.phone))return toast('Add customer name and phone');if(state.draft.step===2&&(!state.draft.area||state.draft.area<=0))return toast('Enter a valid built-up area');state.draft.step=Math.min(6,state.draft.step+1);save();render()}function prevStep(){state.draft.step=Math.max(1,state.draft.step-1);save();render()}function saveDraft(){save();toast('Quote draft saved locally')}function choosePackage(p){state.draft.package=p;const rc=state.rateCards[state.draft.city][p];state.draft.margin=rc.margin;state.draft.contingency=rc.contingency;save();render()}function toggleAddon(i,v){state.draft.addons[i].selected=v;save();render()}function setAddonAmount(i,v){state.draft.addons[i].amount=+v;save();render()}function addCustomAddon(){if(!customName.value||!+customAmount.value)return toast('Add a line-item name and amount');state.draft.customAddons.push({name:customName.value,amount:+customAmount.value,included:true});save();render()}function removeCustom(i){state.draft.customAddons.splice(i,1);save();render()}function setGst(v){state.draft.gstEnabled=v;save();render()}
function generateQuote(){const d=state.draft,c=calc(d);const id='Q-'+(++state.lastQuoteId);const q={id,customer:d.customer,phone:d.phone,email:d.email,city:d.city,locality:d.locality,area:d.area,floors:d.floors,package:d.package,amount:c.final,status:'Draft',updated:'Just now',validity:d.validity,timeline:d.timeline,calculation:c,draft:JSON.parse(JSON.stringify(d)),revision:1};state.quotes.unshift(q);let cust=state.customers.find(x=>x.phone===d.phone);if(!cust)state.customers.unshift({name:d.customer,phone:d.phone,city:d.city,project:d.constructionType,area:d.area,status:'Quoted',followup:'Not set'});currentQuote=q;save();go('preview')}
function openQuote(id){currentQuote=state.quotes.find(q=>q.id===id);if(currentQuote&&!currentQuote.draft){const d=newDraft();Object.assign(d,{customer:currentQuote.customer,phone:currentQuote.phone,city:currentQuote.city,locality:currentQuote.locality,area:currentQuote.area,floors:currentQuote.floors,package:currentQuote.package,validity:currentQuote.validity});currentQuote.draft=d;currentQuote.calculation=calc(d)}go('preview')}
function preview(){if(!currentQuote)currentQuote=state.quotes[0];const q=currentQuote,d=q.draft,c=q.calculation||calc(d);return `<div class="page-head"><div><h2>${q.id} · Quote preview</h2><p>Customer-ready document with contractor-controlled pricing.</p></div><div class="row preview-actions"><button class="btn" onclick="editQuote()">Edit quote</button><button class="btn" onclick="createRevision()">Create revision</button><button class="btn" onclick="window.print()">Download / Print PDF</button><button class="btn wa" onclick="go('share')">Send on WhatsApp</button></div></div>${trust()}<article class="quote-paper"><div class="quote-header"><div><p class="small muted">HOUSE CONSTRUCTION QUOTATION</p><h2 class="quote-title">${esc(state.settings.company)}</h2><p>GSTIN: ${esc(state.settings.gstNumber)}</p></div><div><b>${q.id}</b><br><span class="muted">Revision ${q.revision||1} · Valid ${q.validity} days</span></div></div><div class="grid cols-2"><div><h3>Prepared for</h3><b>${esc(q.customer)}</b><p>${esc(q.phone)}<br>${esc(d.locality)}, ${esc(d.city)}</p></div><div class="quote-total"><span>Quotation total</span><strong>${money(c.final)}</strong><span>${money(c.effective)} / sq.ft.</span></div></div><div class="paper-section"><h3>Project & package</h3><div class="grid cols-3"><div><span class="small muted">Built-up area</span><br><b>${Number(d.area).toLocaleString('en-IN')} sq.ft.</b></div><div><span class="small muted">Floors / timeline</span><br><b>${esc(d.floors)} · ${esc(d.timeline)}</b></div><div><span class="small muted">Package</span><br><b>${esc(d.package)}</b></div></div></div><div class="paper-section"><h3>Cost breakup</h3>${breakdown(c)}</div><div class="paper-section"><h3>Assumptions</h3><p>${esc(state.templates.assumptions)}</p></div><div class="paper-section"><h3>Exclusions</h3><ul class="paper-list">${c.rc.excluded.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="paper-section"><h3>Payment milestones</h3><table><tbody>${d.milestones.map(m=>`<tr><td>${esc(m[0])}</td><td style="text-align:right">${m[1]}%</td><td style="text-align:right"><b>${money(c.final*m[1]/100)}</b></td></tr>`).join('')}</tbody></table></div><div class="paper-section"><h3>Terms</h3><p>Timeline: ${esc(d.timeline)} · Quote validity: ${d.validity} days.</p><p>${esc(state.templates.escalation)}</p><p class="small muted">This quotation is based on the selected local rate card and listed assumptions. Final pricing may change after site visit, design confirmation, material selection, and scope changes.</p></div><div class="signature"><div>For ${esc(state.settings.company)}</div><div>Customer acceptance</div></div><p class="small muted" style="text-align:center;margin-top:35px">${esc(state.settings.footer)}</p></article>`}
function editQuote(){state.draft=JSON.parse(JSON.stringify(currentQuote.draft));state.draft.step=6;save();go('wizard')}function createRevision(){const clone=JSON.parse(JSON.stringify(currentQuote));clone.id=currentQuote.id+'-R'+((currentQuote.revision||1)+1);clone.revision=(currentQuote.revision||1)+1;clone.status='Draft';clone.updated='Just now';state.quotes.unshift(clone);currentQuote=clone;save();toast('Revision created');render()}
function whatsappText(q=currentQuote){const d=q.draft,c=q.calculation||calc(d);return `Hello ${d.customer},\n\nSharing the preliminary quotation for your ${d.floors} house construction at ${d.locality}, ${d.city}.\n\nBuilt-up area: ${Number(d.area).toLocaleString('en-IN')} sq.ft.\nPackage: ${d.package}\nEstimated cost: ${money(c.final)}\nValidity: ${d.validity} days\n\nThis estimate is calculated from the selected local rate card and the assumptions mentioned in the quotation. Items like approvals, borewell, compound wall, interiors, modular kitchen, lift, and major material escalation are excluded unless specifically mentioned.\n\nI am sharing the PDF quotation for your review. We can revise the scope after site discussion.`}
function share(){if(!currentQuote)currentQuote=state.quotes[0];return `<div class="page-head"><div><h2>WhatsApp share</h2><p>India-native customer communication generated from the approved quote data.</p></div><button class="btn" onclick="go('preview')">Back to preview</button></div>${trust()}<div class="grid cols-2"><div class="wa-card" id="waText">${esc(whatsappText())}</div><div class="card pad"><h3>Share actions</h3><p class="muted">The message explains the quote. It does not create or alter any price.</p><div class="grid"><button class="btn wa" onclick="copyWhatsApp()">Copy WhatsApp message</button><button class="btn primary" onclick="markSent()">Mark as sent</button><button class="btn" onclick="setFollowup()">Set follow-up reminder</button><button class="btn" onclick="createRevision()">Create revision</button></div></div></div>`}
async function copyWhatsApp(){try{await navigator.clipboard.writeText(whatsappText());toast('WhatsApp message copied')}catch(e){toast('Select and copy the message manually')}}function markSent(){currentQuote.status='Sent';currentQuote.updated='Just now';const c=state.customers.find(x=>x.phone===currentQuote.phone);if(c)c.status='Follow-up';save();toast('Quote marked as sent');setTimeout(()=>go('dashboard'),650)}function setFollowup(){const c=state.customers.find(x=>x.phone===currentQuote.phone);if(c)c.followup='2026-06-22';save();toast('Follow-up set for 22 Jun 2026')}
function customers(){return `<div class="page-head"><div><h2>Customers / Leads</h2><p>Quote history, status and next follow-up in one place.</p></div><button class="btn primary" onclick="startNew()">Create quote</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>City</th><th>Project</th><th>Area</th><th>Quotes</th><th>Last amount</th><th>Status</th><th>Next follow-up</th></tr></thead><tbody>${state.customers.map(c=>{const qs=state.quotes.filter(q=>q.phone===c.phone);return `<tr onclick="customerProfile('${c.phone}')" style="cursor:pointer"><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.city)}</td><td>${esc(c.project)}</td><td>${Number(c.area).toLocaleString('en-IN')} sq.ft.</td><td>${qs.length}</td><td>${qs[0]?money(qs[0].amount):'-'}</td><td>${badge(c.status)}</td><td>${esc(c.followup)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function customerProfile(phone){const c=state.customers.find(x=>x.phone===phone),qs=state.quotes.filter(x=>x.phone===phone);document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal"><div class="modal-head"><div><b>${esc(c.name)}</b><div class="small muted">${esc(c.phone)} · ${esc(c.city)}</div></div><button class="btn sm" onclick="closeModal()">Close</button></div><div class="pad"><h3>Quote history</h3>${qs.length?quoteTable(qs):'<div class="empty">No quotes yet.</div>'}<h3>Notes & follow-up</h3><textarea class="input" placeholder="Add customer notes"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" onclick="toast('Customer note saved')">Save note</button><button class="btn" onclick="startNew();closeModal()">Create another quote</button></div></div></div></div>`}function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalRoot').innerHTML=''}
function templates(){const t=state.templates;return `<div class="page-head"><div><h2>Templates</h2><p>Edit the language AI may help draft; pricing remains untouched.</p></div><button class="btn primary" onclick="saveTemplates()">Save templates</button></div><div class="grid cols-2">${Object.entries({assumptions:'Assumptions',exclusions:'Exclusions',milestones:'Payment milestones',validity:'Validity terms',escalation:'Escalation note',whatsapp:'WhatsApp template guidance'}).map(([k,l])=>`<div class="card pad field"><label>${l}</label><textarea class="input template-input" data-k="${k}">${esc(t[k])}</textarea></div>`).join('')}</div>`}function saveTemplates(){document.querySelectorAll('.template-input').forEach(x=>state.templates[x.dataset.k]=x.value);save();toast('Templates saved')}
function analytics(){const q=state.quotes,total=q.reduce((a,b)=>a+b.amount,0),avg=q.length?total/q.length:0;const cityCounts=cities.map(c=>[c,q.filter(x=>x.city===c).length]);const pkgCounts=packages.map(p=>[p,q.filter(x=>x.package===p).length]);return `<div class="page-head"><div><h2>Analytics</h2><p>Quotation throughput, value and rate-card confidence.</p></div></div><div class="grid cols-4" style="margin-bottom:16px"><div class="card kpi"><div class="label">Quotes created</div><div class="value">${q.length}</div></div><div class="card kpi"><div class="label">Quote value generated</div><div class="value" style="font-size:22px">${money(total)}</div></div><div class="card kpi"><div class="label">Average quote</div><div class="value" style="font-size:22px">${money(avg)}</div></div><div class="card kpi"><div class="label">Follow-ups due</div><div class="value">2</div></div></div><div class="grid cols-3"><div class="card pad"><h3>City mix</h3>${bars(cityCounts)}</div><div class="card pad"><h3>Package mix</h3>${bars(pkgCounts)}</div><div class="card pad"><h3>Status</h3>${bars(['Draft','Sent','Won'].map(s=>[s,q.filter(x=>x.status===s).length]))}<h3>Rate-card confidence</h3><p>${badge('1 locally validated')} ${badge('15 draft estimates')}</p></div></div>`}function bars(rows){const max=Math.max(1,...rows.map(x=>x[1]));return rows.map(x=>`<div style="margin:13px 0"><div class="row" style="justify-content:space-between"><span class="small">${esc(x[0])}</span><b>${x[1]}</b></div><div class="bar"><i style="width:${x[1]/max*100}%"></i></div></div>`).join('')}
function settings(){const s=state.settings;return `<div class="page-head"><div><h2>Settings</h2><p>Company defaults, quote terms and prototype data controls.</p></div><button class="btn primary" onclick="saveSettings()">Save settings</button></div><div class="grid cols-2"><div class="card pad"><h3>Company & quote defaults</h3><div class="form-grid"><div class="field"><label>Company name</label><input class="input setting" data-k="company" value="${esc(s.company)}"></div><div class="field"><label>Logo</label><input class="input" value="Company initials placeholder" disabled></div><div class="field"><label>GST number</label><input class="input setting" data-k="gstNumber" value="${esc(s.gstNumber)}"></div><div class="field"><label>Default margin %</label><input class="input setting" data-k="margin" type="number" value="${s.margin}"></div><div class="field"><label>Default contingency %</label><input class="input setting" data-k="contingency" type="number" value="${s.contingency}"></div><div class="field"><label>Default GST %</label><input class="input setting" data-k="gst" type="number" value="${s.gst}"></div><div class="field"><label>Default validity</label><input class="input setting" data-k="validity" type="number" value="${s.validity}"></div><div class="field"><label>Active cities</label><input class="input" value="${cities.join(', ')}" disabled></div><div class="field" style="grid-column:span 2"><label>Quote footer</label><textarea class="input setting" data-k="footer">${esc(s.footer)}</textarea></div></div></div><div class="card pad"><h3>Excel SSOT import</h3><p class="muted">Parse known sheet names, preview extracted records, then apply research data. Existing rate cards are never overwritten by this prototype import.</p><div class="import-drop"><input type="file" id="xlsxFile" accept=".xlsx,.xls" onchange="previewWorkbook(this.files[0])"><p class="small">Expected: Dashboard, City Market Scan, Rate Benchmarks, ICP & Segments, Competitive Map, Source Register, Validation Backlog, Pricing Model, GTM Plan.</p></div><div id="importStatus" style="margin-top:12px"></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Prototype data</h3><p class="muted">Reset removes all locally edited rate cards, drafts, quotes, customers and imported research.</p><button class="btn danger" onclick="resetDemo()">Reset demo data</button></div></div>`}
function saveSettings(){document.querySelectorAll('.setting').forEach(x=>state.settings[x.dataset.k]=x.type==='number'?+x.value:x.value);save();render();toast('Settings saved')}function resetDemo(){if(!confirm('Reset all prototype data to the original demo seed?'))return;state=seedState();save();view='dashboard';render();toast('Demo data reset')}
async function previewWorkbook(file){if(!file)return;if(!window.XLSX){importStatus.innerHTML='<div class="alert red">Excel parser could not load. Use an internet connection or provide normalized JSON.</div>';return}const data=await file.arrayBuffer(),wb=XLSX.read(data),known=['Dashboard','City Market Scan','Rate Benchmarks','ICP & Segments','Competitive Map','Source Register','Validation Backlog','Pricing Model','GTM Plan'];importPreview={};known.forEach(n=>{if(wb.Sheets[n])importPreview[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''})});const missing=known.filter(n=>!importPreview[n]);importStatus.innerHTML=`<div class="alert"><b>Preview ready:</b> ${Object.entries(importPreview).map(x=>`${x[0]} (${x[1].length})`).join(', ')}${missing.length?`<br>Missing sheets: ${missing.join(', ')}`:''}</div><button class="btn primary" style="margin-top:10px" onclick="applyImport()">Apply research records</button>`}
function applyImport(){if(!importPreview)return;state.research.cityMarketScan=importPreview['City Market Scan']||[];state.research.icpSegments=importPreview['ICP & Segments']||[];state.research.competitors=importPreview['Competitive Map']||[];state.research.sources=importPreview['Source Register']||[];state.research.validationBacklog=importPreview['Validation Backlog']||[];state.research.pricingModel=importPreview['Pricing Model']||[];state.research.gtmPlan=importPreview['GTM Plan']||[];save();toast('Research imported; rate cards left unchanged');go('internal')}
const internalTabs=[['validation','Validation Dashboard'],['interviews','Research / Interviews'],['rateops','Rate Validation Ops'],['sources','Source Register'],['pricing','Pricing Model'],['gtm','GTM Plan']];
function internal(){return `<div class="page-head"><div><h2>Internal / Founder Validation</h2><p>Research, evidence and go/no-go operations, separate from the customer quotation experience.</p></div><button class="btn" onclick="go('settings')">Import Excel SSOT</button></div><div class="subnav">${internalTabs.map(x=>`<button class="${internalTab===x[0]?'active':''}" onclick="setInternal('${x[0]}')">${x[1]}</button>`).join('')}</div>${internalBody()}`}
function setInternal(t){internalTab=t;render()}
function internalBody(){const r=state.research;if(internalTab==='validation'){const d=r.dashboard||ssot.dashboard;return `<div class="grid cols-3" style="margin-bottom:16px"><div class="card pad"><span class="badge green">Recommendation</span><p><b>${esc(d.recommendation)}</b></p><p class="small muted">${esc(d.wedge)}</p></div><div class="card pad"><span class="badge amber">Fatal risk</span><p><b>${esc(d.fatalRisk)}</b></p><p class="small muted">SSOT rule: ${esc(d.rule)}</p></div><div class="card pad"><span class="badge blue">Pilot ask</span><p><b>${esc(d.pilotAsk)}</b></p><p class="small muted">MVP buyer: ${esc(d.buyer)}</p></div></div><div class="card" style="margin-bottom:16px"><div class="card-head"><h3>City priority from the SSOT</h3><span class="small muted">Research date · 19 Jun 2026</span></div><div class="table-wrap"><table><thead><tr><th>City</th><th>Attractiveness</th><th>Right-to-win</th><th>Priority</th><th>Rationale</th></tr></thead><tbody>${d.cities.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}/5</td><td>${x[2]}/5</td><td>${badge('#'+x[3])}</td><td>${esc(x[4])}</td></tr>`).join('')}</tbody></table></div></div><div class="card-head card" style="border-radius:14px 14px 0 0"><h3>Validation backlog</h3><span class="small muted">Evidence → cheapest test → decision threshold</span></div>${internalTable(r.validationBacklog,['Hypothesis','Risk type','Evidence today','Cheapest test','Sample','Pass threshold','Kill / reframe threshold','Owner','Timeline'])}<div style="height:16px"></div><div class="grid cols-2"><div><div class="card-head card" style="border-radius:14px 14px 0 0"><h3>ICP & segments</h3></div>${internalTable(r.icpSegments,['Segment','Buyer / user','Job-to-be-done','Pain intensity','WTP hypothesis','Right-to-win','Priority'])}</div><div><div class="card-head card" style="border-radius:14px 14px 0 0"><h3>Competitive wedge</h3></div>${internalTable(r.competitors,['Alternative','Category','Strength','Gap vs HQC','Threat level','Wedge response'])}</div></div>`}if(internalTab==='interviews')return `<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Priority recruiting segments</h3><span class="small muted">From ICP & Segments</span></div>${internalTable(r.icpSegments,['Segment','Buyer / user','Job-to-be-done','Pain intensity','WTP hypothesis','Priority','Qualifying questions'])}</div><div class="card"><div class="card-head"><h3>Research / Interview Tracker</h3><button class="btn sm" onclick="toast('Interview row added in demo')">Add interview</button></div><div class="table-wrap"><table><thead><tr>${['Name','Segment','City','Quotes / month','Current method','Time / quote','Pain','Trust','WTP','Old quotes','Rate card','Pilot','Follow-up'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td>Demo contractor</td><td>Small contractor</td><td>Bhubaneswar</td><td>8</td><td>Excel + WhatsApp</td><td>2 hours</td><td>4/5</td><td>4/5</td><td>₹10K–₹20K</td><td>Yes</td><td>Yes</td><td>${badge('Active')}</td><td>Validate Standard rate</td></tr></tbody></table></div></div>`;if(internalTab==='rateops'){const rows=[];cities.forEach(c=>packages.forEach(p=>{const x=state.rateCards[c][p];rows.push({City:c,Package:p,'Source quality':x.sourceQuality,'Validator count':x.validators,'Confidence score':confidenceScore(x),'Approval status':x.status,'Pending action':x.status==='approved'?'Review on due date':ssot.rateBenchmarks[c].action,'Review due':x.reviewDue})}));return internalTable(rows,['City','Package','Source quality','Validator count','Confidence score','Approval status','Pending action','Review due'])}if(internalTab==='sources')return internalTable(r.sources,['ID','Tier','Source','URL','What it supports','Reliability note']);if(internalTab==='pricing')return `<div class="alert" style="margin-bottom:16px"><b>SSOT estimate:</b> Total annual base SAM across the four cities is ${money(142160400)}. Confidence remains low; validate via lead lists and paid pilots.</div>${internalTable(r.pricingModel,['City','Paying accounts low','Base','High','ARPA low','Base ARPA','High ARPA','Annual SAM low','Base SAM','High SAM','Confidence','Notes'])}`;return internalTable(r.gtmPlan,['Phase','Timeline','Goal','Target accounts','Action','Metric','Go / no-go'])}
function getVal(o,label){const aliases={Hypothesis:['hypothesis'],'Risk type':['risk','risk type'],'Cheapest test':['test','cheapest test'],'Pass threshold':['pass','pass threshold'],'Kill / reframe':['kill','kill/reframe threshold'],'Owner':['owner'],'Timeline':['timeline'],ID:['source id','id'],Tier:['source tier','tier'],Source:['source name','source'],URL:['url'],'What it supports':['what it supports'],'Reliability note':['reliability note']};const keys=Object.keys(o);const wanted=[label.toLowerCase(),...(aliases[label]||[])];const k=keys.find(k=>wanted.includes(k.toLowerCase().trim()));return k?o[k]:''}
function internalTable(rows,headers){if(!rows||!rows.length)return `<div class="card empty"><h3>No workbook records imported</h3><p>Import the market-research SSOT from Settings. The prototype will preview sheet counts before applying and will not overwrite rate cards.</p><button class="btn primary" onclick="go('settings')">Import Excel SSOT</button></div>`;return `<div class="card table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(o=>`<tr>${headers.map(h=>{const v=getVal(o,h)||o[h]||'-';return `<td>${h==='URL'&&v!=='-'?`<a href="${esc(v)}" target="_blank" style="color:var(--teal2);font-weight:700">Open source</a>`:esc(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
render();
</script>
<script src="../_shared/return-bar.js?v=2"></script>
</body>
</html>
