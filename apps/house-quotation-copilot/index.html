<script>

  Sambalpur:[[1150,1300,1450],[1550,1650,1800],[1750,1950,2150],[2150,2350,2650]],

const defaultExclusions=['Architectural / structural design fees','Government approvals and statutory charges','Borewell and external development','Loose furniture and appliances','Major rock excavation or dewatering','Utility connection deposits'];
const defaultMilestones=[['Booking / mobilisation',10],['Foundation',15],['Plinth & ground slab',15],['Structure',25],['Brickwork & plaster',15],['Finishes',15],['Handover',5]];
const addOnNames=['Compound wall','Sump / overhead tank','Modular kitchen allowance','Solar-ready conduit','Premium façade allowance'];
const ALL_PERMS=['dashboard.view','quotes.view','quote.create','quote.edit','quote.revise','quote.status','quote.share','quote.commercial.override','rates.view','rates.edit','rates.approve','customers.view','customers.edit','templates.view','templates.edit','analytics.view','copilot.use','access.view','users.manage','audit.view','api.view','settings.view','settings.edit'];
const ROLES={
  owner:{label:'Owner / Admin',perms:['*']},
  estimator:{label:'Estimator / Civil Engineer',perms:['dashboard.view','quotes.view','quote.create','quote.edit','quote.revise','rates.view','customers.view','customers.edit','templates.view','analytics.view','copilot.use','api.view']},

  sales:{label:'Sales / CRM User',perms:['dashboard.view','quotes.view','quote.status','quote.share','customers.view','customers.edit','templates.view','analytics.view','copilot.use']},
  auditor:{label:'Viewer / Auditor',perms:['dashboard.view','quotes.view','rates.view','customers.view','analytics.view','audit.view','api.view']}

const USERS=[
  {id:'u-owner',name:'Aarav Rao',role:'owner',active:true},
  {id:'u-est',name:'Meera Estimator',role:'estimator',active:true},
  {id:'u-rate',name:'Rakesh Approver',role:'rate_manager',active:true},
  {id:'u-sales',name:'Sana Sales',role:'sales',active:true},
  {id:'u-audit',name:'Vikram Auditor',role:'auditor',active:true}
];
const API_CATALOG={
  pincode:{name:'Postal PIN Code',purpose:'Validate Indian PIN and resolve post office, district and state.',endpoint:'https://api.postalpincode.in/pincode/{PIN}',source:'https://www.postalpincode.in/Api-Details',pricingImpact:false},
  geocode:{name:'Nominatim / OpenStreetMap',purpose:'Resolve a project address to latitude and longitude.',endpoint:'https://nominatim.openstreetmap.org/search',source:'https://nominatim.org/release-docs/latest/api/Search/',pricingImpact:false},
  weather:{name:'Open-Meteo',purpose:'Show near-term site weather context for planning and customer discussion.',endpoint:'https://api.open-meteo.com/v1/forecast',source:'https://open-meteo.com/en/docs',pricingImpact:false}
};
function todayISO(){return new Date().toISOString().slice(0,10)}
function plusDays(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function uid(prefix='id'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function seedRateCards(){const out={};cities.forEach(city=>{out[city]={};packages.forEach((pkg,i)=>{const [min,expected,max]=seedRates[city][i];const approved=city==='Bhubaneswar'&&pkg==='Standard Turnkey';const validated=city==='Hyderabad'&&pkg==='Standard Turnkey';out[city][pkg]={id:`rc-${city.slice(0,3).toLowerCase()}-${i}`,city,package:pkg,min,expected,max,margin:10,contingency:5,wastage:3,gstPolicy:'GST optional; apply only as configured by contractor.',status:approved?'approved':validated?'validated':'draft',version:approved?2:1,validators:approved?2:validated?1:0,sourceQuality:approved?'Local contractor validated':validated?'Public benchmark + one validation':'Demo seed — validation required',sourceUrls:approved?'Contractor interview + internal rate sheet':'',labourNotes:'Demo starting point. Replace with contractor-owned rates before customer use.',reviewDue:plusDays(approved?45:15),included:['RCC structure','Brick/block masonry','Internal plaster','Standard electrical & plumbing allowance'],excluded:[...defaultExclusions],history:[{version:1,status:'draft',at:new Date().toISOString(),by:'System seed'}]};});});return out}
function newDraft(){return{id:uid('draft'),customer:'Rohit Sharma',phone:'9876543210',email:'',customerType:'Homeowner lead',leadSource:'Referral',address:'Plot 12, Patia',pincode:'751024',postOffice:'Patia Gds',district:'Khorda',stateName:'Odisha',city:'Bhubaneswar',locality:'Patia',latitude:null,longitude:null,geocodeLabel:'',siteVerified:false,weather:null,area:2000,floors:'G+1',plotType:'Residential plot',constructionType:'New construction',startDate:plusDays(30),timeline:'8–12 months',package:'Standard Turnkey',addons:addOnNames.map(n=>({name:n,amount:0,selected:false})),customAddons:[],margin:10,contingency:5,gstEnabled:false,gst:18,discount:0,validity:15,milestones:defaultMilestones.map(x=>[...x]),step:1,notes:''}}
function seedState(){const d=newDraft();return{version:APP_VERSION,settings:{company:'SR Constructions',gstNumber:'21ABCDE1234F1Z5',phone:'9876500000',margin:10,contingency:5,gst:18,validity:15,footer:'Thank you for the opportunity to quote your project.'},users:JSON.parse(JSON.stringify(USERS)),rateCards:seedRateCards(),customers:[{id:'c1',name:'Rohit Sharma',phone:'9876543210',email:'',city:'Bhubaneswar',project:'New construction',area:2000,status:'Quoted',notes:'Referral lead. Interested in Standard Turnkey.',followup:plusDays(2)},{id:'c2',name:'Ananya Mishra',phone:'9876501122',email:'ananya@example.com',city:'Bhubaneswar',project:'New construction',area:1650,status:'Lead',notes:'Needs budget clarity before design freeze.',followup:plusDays(5)}],quotes:[],draft:d,lastQuoteId:1023,templates:{assumptions:'Rates assume normal soil conditions, clear site access, standard working hours, and material specifications listed in the selected package.',exclusions:defaultExclusions.join('\n'),validity:'This quotation is valid for the configured number of days from issue.',escalation:'Major material escalation after quote validity will be reviewed and agreed before procurement.',whatsapp:'Friendly, concise and factual. Mention quote ID, project, amount, validity and that final scope is subject to site/design confirmation.'},audit:[],apiCache:{},copilot:[{id:'m0',from:'bot',text:'I can explain quotations, rate-card blocks, follow-ups, revisions and access rules. I do not create construction prices.'}]}}
function loadState(){try{const raw=localStorage.getItem(KEY);if(!raw)return seedState();const s=JSON.parse(raw);if(!s||!s.rateCards||!s.users)return seedState();return s}catch(e){return seedState()}}
let state=loadState();
let view='dashboard',rateCity='Bhubaneswar',ratePkg='Standard Turnkey',currentQuoteId=null;
let currentUserId=localStorage.getItem(SESSION_KEY)||'u-owner';
if(!state.users.some(u=>u.id===currentUserId&&u.active))currentUserId='u-owner';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function currentUser(){return state.users.find(u=>u.id===currentUserId)||state.users[0]}
function can(p){const r=ROLES[currentUser().role];return !!(r&&(r.perms.includes('*')||r.perms.includes(p)))}
function requirePerm(p,action='perform this action'){if(can(p))return true;toast(`${ROLES[currentUser().role].label} cannot ${action}`);audit('ACCESS_DENIED','permission',p,`Attempted to ${action}`);return false}
function switchUser(id){const u=state.users.find(x=>x.id===id&&x.active);if(!u)return toast('User is inactive or missing');currentUserId=id;localStorage.setItem(SESSION_KEY,id);audit('SESSION_SWITCH','user',id,`Switched demo session to ${u.name}`);if(!routeAllowed(view))view='dashboard';render()}
function audit(action,type,id,detail,persist=true){const u=currentUser();state.audit.unshift({id:uid('evt'),at:new Date().toISOString(),userId:u?.id||'system',user:u?.name||'System',role:u?.role||'system',action,type,entityId:id||'',detail:detail||''});state.audit=state.audit.slice(0,500);if(persist)save()}
function money(n){return '₹'+Math.round(Number(n)||0).toLocaleString('en-IN')}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function badge(s){const k=String(s).toLowerCase();let c='gray';if(k.includes('approved')||k.includes('won')||k.includes('success')||k.includes('pass')||k.includes('active'))c='green';else if(k.includes('draft')||k.includes('pending')||k.includes('due')||k.includes('validated'))c='amber';else if(k.includes('sent')||k.includes('cached')||k.includes('live'))c='blue';else if(k.includes('blocked')||k.includes('fail')||k.includes('inactive'))c='red';else if(k.includes('owner')||k.includes('manager'))c='purple';return `<span class="badge ${c}">${esc(s)}</span>`}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2800)}
function trust(){return `<div class="trust"><div><b>Governed pricing</b>Live APIs validate or enrich site context only. Customer pricing is calculated exclusively from a selected <strong>approved</strong> contractor-controlled rate card and a saved quote snapshot.</div></div>`}
const NAV=[
  ['Workspace',[['dashboard','Dashboard','dashboard.view'],['quotes','Quotes','quotes.view'],['wizard','New Quote','quote.create'],['customers','Customers / Leads','customers.view'],['copilot','Copilot','copilot.use']]],
  ['Pricing',[['ratecards','Rate Cards','rates.view'],['templates','Templates','templates.view'],['analytics','Analytics','analytics.view']]],
  ['Governance',[['access','Access Control','access.view'],['audit','Audit Log','audit.view'],['apihealth','API & QA','api.view'],['settings','Settings','settings.view']]]
];
const ROUTE_PERM=Object.fromEntries(NAV.flatMap(g=>g[1]).map(x=>[x[0],x[2]]));
ROUTE_PERM.preview='quotes.view';ROUTE_PERM.share='quote.share';
function routeAllowed(v){return !ROUTE_PERM[v]||can(ROUTE_PERM[v])}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(g=>{const items=g[1].filter(n=>can(n[2]));return items.length?`<div class="nav-label">${g[0]}</div>${items.map(n=>`<button data-view="${n[0]}" class="${view===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}`:''}).join('')}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function go(v){if(!routeAllowed(v)){toast('This role cannot open that workspace');return}if(v==='wizard'&&!state.draft)state.draft=newDraft();view=v;render();window.scrollTo(0,0);document.getElementById('sidebar').classList.remove('open')}
function renderSession(){const s=document.getElementById('sessionSelect');s.innerHTML=state.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${u.id===currentUserId?'selected':''}>${esc(u.name)} · ${esc(ROLES[u.role].label)}</option>`).join('');document.getElementById('companyChip').textContent=state.settings.company}
function render(){if(!routeAllowed(view))view='dashboard';renderNav();renderSession();const titles={dashboard:'Dashboard',quotes:'Quotes',wizard:'New Quote',customers:'Customers / Leads',copilot:'Copilot',ratecards:'Rate Cards',templates:'Templates',analytics:'Analytics',access:'Access Control',audit:'Audit Log',apihealth:'API & QA',settings:'Settings',preview:'Quote Preview',share:'WhatsApp Share'};document.getElementById('pageTitle').textContent=titles[view]||'Quotation OS';const fns={dashboard,quotes,wizard,customers,copilot,ratecards,templates,analytics,access,auditPage,apihealth,settings,preview,share};const fn=view==='audit'?auditPage:fns[view]||dashboard;document.getElementById('page').innerHTML=fn();afterRender()}
function startNew(){if(!requirePerm('quote.create','create a quote'))return;state.draft=newDraft();save();go('wizard')}
function quoteStatusCount(s){return state.quotes.filter(q=>q.status===s).length}
function dashboard(){const q=state.quotes;const due=state.customers.filter(c=>c.followup&&c.followup<=plusDays(3)&&!['Won','Lost'].includes(c.status)).length;const approvedRates=cities.flatMap(c=>packages.map(p=>state.rateCards[c][p])).filter(r=>r.status==='approved').length;return `<div class="page-head"><div><h2>Quotation command center</h2><p>Move a house-construction enquiry from controlled estimate to customer-ready quotation, without letting live data or AI override approved commercial rules.</p></div>${can('quote.create')?'<button class="btn primary" onclick="startNew()">Create New Quote</button>':''}</div>${trust()}<div class="grid cols-4" style="margin-bottom:18px"><div class="card kpi"><div class="label">Total quotes</div><div class="value">${q.length}</div><div class="meta">${quoteStatusCount('Draft')} draft · ${quoteStatusCount('Sent')} sent</div></div><div class="card kpi"><div class="label">Won</div><div class="value">${quoteStatusCount('Won')}</div><div class="meta">${money(q.filter(x=>x.status==='Won').reduce((a,b)=>a+b.amount,0))} booked</div></div><div class="card kpi"><div class="label">Follow-ups due</div><div class="value">${due}</div><div class="meta">Next 3 days / overdue</div></div><div class="card kpi"><div class="label">Approved rate cards</div><div class="value">${approvedRates}<small style="font-size:13px"> / ${cities.length*packages.length}</small></div><div class="meta">Only these can price new quotes</div></div></div><div class="grid cols-2"><div class="card"><div class="card-head"><h3>Recent quotations</h3><button class="btn sm" onclick="go('quotes')">All quotes</button></div>${quoteTable(q.slice(0,6))}</div><div class="card"><div class="card-head"><h3>Follow-up queue</h3><span class="small muted">Customer-owned next actions</span></div>${followupList()}</div></div>`}
function quoteTable(rows){if(!rows.length)return `<div class="empty"><b>No quotations yet</b><p>Create the first governed quotation.</p>${can('quote.create')?'<button class="btn primary" onclick="startNew()">Create quote</button>':''}</div>`;return `<div class="table-wrap"><table><thead><tr><th>Quote</th><th>Customer</th><th>Project</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(q=>`<tr><td><b>${esc(q.id)}</b><div class="tiny muted">R${q.revision}</div></td><td>${esc(q.customer)}</td><td>${esc(q.city)} · ${Number(q.area).toLocaleString('en-IN')} sq.ft.</td><td><b>${money(q.amount)}</b></td><td>${badge(q.status)}</td><td><button class="btn sm" onclick="openQuote('${q.id}')">View</button></td></tr>`).join('')}</tbody></table></div>`}
function followupList(){const rows=state.customers.filter(c=>c.followup).sort((a,b)=>a.followup.localeCompare(b.followup)).slice(0,7);if(!rows.length)return '<div class="empty">No follow-ups scheduled.</div>';return `<div class="pad">${rows.map(c=>`<div class="kv"><span><b>${esc(c.name)}</b><br><small>${esc(c.city)} · ${esc(c.status)}</small></span><b>${esc(c.followup)}</b></div>`).join('')}</div>`}
function quotes(){return `<div class="page-head"><div><h2>Quotations</h2><p>Every issued quote keeps a frozen rate-card snapshot so later rate edits cannot silently change historical customer pricing.</p></div>${can('quote.create')?'<button class="btn primary" onclick="startNew()">New Quote</button>':''}</div><div class="card">${quoteTable(state.quotes)}</div>`}
function currentRate(d=state.draft){return state.rateCards[d.city]?.[d.package]||null}
function calcWithRate(d,rc){if(!rc)return{base:0,scope:0,contingency:0,margin:0,taxable:0,gst:0,discount:+d.discount||0,final:0,effective:0,rc:null};const base=(+d.area||0)*(+rc.expected||0);const scope=[...(d.addons||[]).filter(x=>x.selected),...(d.customAddons||[])].reduce((a,b)=>a+(+b.amount||0),0);const pre=base+scope;const contingency=pre*((+d.contingency||0)/100);const margin=(pre+contingency)*((+d.margin||0)/100);const taxable=pre+contingency+margin;const gst=d.gstEnabled?taxable*((+d.gst||0)/100):0;const discount=+d.discount||0;const final=Math.max(0,taxable+gst-discount);return{base,scope,contingency,margin,taxable,gst,discount,final,effective:d.area?final/d.area:0,rc}}
function calc(d=state.draft){return calcWithRate(d,currentRate(d))}
function wizard(){const d=state.draft||newDraft();state.draft=d;const c=calc(d);return `<div class="page-head"><div><h2>New quotation</h2><p>Six controlled steps. Site services improve context; the approved local rate card remains the commercial source of truth.</p></div><button class="btn" onclick="saveDraft()">Save Draft</button></div><div class="stepper">${['Customer','Site','Scope','Package','Commercial','Review'].map((s,i)=>`<button class="step ${d.step===i+1?'active':d.step>i+1?'done':''}" onclick="setStep(${i+1})">${i+1}. ${s}</button>`).join('')}</div><div class="wizard-layout"><div>${wizardStep(d,c)}</div><aside class="card pad summary"><div class="summary-total"><span>Current estimate</span><strong>${money(c.final)}</strong><small>${money(c.effective)} / sq.ft.</small></div>${c.rc?`<div class="kv"><span>Rate card</span><b>${esc(c.rc.city)} / ${esc(c.rc.package)}</b></div><div class="kv"><span>Rate status</span>${badge(c.rc.status)}</div><div class="kv"><span>Rate / sq.ft.</span><b>${money(c.rc.expected)}</b></div>`:''}<div class="kv"><span>Built-up area</span><b>${Number(d.area||0).toLocaleString('en-IN')} sq.ft.</b></div><div class="kv"><span>Site</span><b>${d.siteVerified?'Verified':'Manual / pending'}</b></div>${c.rc&&c.rc.status!=='approved'?'<div class="alert red" style="margin-top:12px"><b>Generation blocked.</b><br>This rate card is not approved.</div>':''}</aside></div>`}
function wizardStep(d,c){if(d.step===1)return `<div class="card pad"><h3>Customer / lead</h3><div class="form-grid"><div class="field"><label>Customer name *</label><input class="input draft-input" data-k="customer" value="${esc(d.customer)}"></div><div class="field"><label>Mobile *</label><input class="input draft-input" data-k="phone" inputmode="numeric" value="${esc(d.phone)}"></div><div class="field"><label>Email</label><input class="input draft-input" data-k="email" value="${esc(d.email)}"></div><div class="field"><label>Lead source</label><select class="input draft-input" data-k="leadSource">${['Referral','Website','WhatsApp','Walk-in','Architect','Other'].map(x=>`<option ${x===d.leadSource?'selected':''}>${x}</option>`).join('')}</select></div></div>${wizardNav()}</div>`;
if(d.step===2)return `<div class="card pad"><h3>Project site</h3><p class="muted">PIN validation, geocoding and weather are advisory. You can continue with manual data if an external service is unavailable.</p><div class="form-grid three"><div class="field"><label>PIN code</label><div class="row"><input id="pinInput" class="input draft-input" data-k="pincode" inputmode="numeric" maxlength="6" value="${esc(d.pincode)}" style="flex:1"><button class="btn" onclick="lookupPincode()">Validate PIN</button></div></div><div class="field"><label>City *</label><select class="input draft-input" data-k="city">${cities.map(x=>`<option ${x===d.city?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Locality</label><input class="input draft-input" data-k="locality" value="${esc(d.locality)}"></div><div class="field"><label>Address / plot</label><input class="input draft-input" data-k="address" value="${esc(d.address)}"></div><div class="field"><label>District</label><input class="input draft-input" data-k="district" value="${esc(d.district)}"></div><div class="field"><label>State</label><input class="input draft-input" data-k="stateName" value="${esc(d.stateName)}"></div></div><div class="row" style="margin-top:15px"><button class="btn dark" onclick="geocodeSite()">Resolve Site Coordinates</button><button class="btn" onclick="loadWeather()" ${d.latitude&&d.longitude?'':'disabled'}>Load 5-day Weather</button>${d.latitude&&d.longitude?`<a class="btn" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(d.latitude)}&mlon=${encodeURIComponent(d.longitude)}#map=16/${encodeURIComponent(d.latitude)}/${encodeURIComponent(d.longitude)}">Open Map</a>`:''}</div><div id="siteApiStatus" style="margin-top:14px">${siteContext(d)}</div>${wizardNav()}</div>`;
if(d.step===3)return `<div class="card pad"><h3>House scope</h3><div class="form-grid three"><div class="field"><label>Built-up area (sq.ft.) *</label><input class="input draft-input" data-k="area" type="number" min="1" value="${d.area}"></div><div class="field"><label>Floors</label><select class="input draft-input" data-k="floors">${['Ground only','G+1','G+2','G+3'].map(x=>`<option ${x===d.floors?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Plot type</label><select class="input draft-input" data-k="plotType">${['Residential plot','Corner plot','Narrow access plot','Redevelopment'].map(x=>`<option ${x===d.plotType?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Construction type</label><select class="input draft-input" data-k="constructionType">${['New construction','Extension','Major renovation'].map(x=>`<option ${x===d.constructionType?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Planned start</label><input class="input draft-input" data-k="startDate" type="date" value="${esc(d.startDate)}"></div><div class="field"><label>Indicative timeline</label><select class="input draft-input" data-k="timeline">${['6–8 months','8–12 months','12–16 months'].map(x=>`<option ${x===d.timeline?'selected':''}>${x}</option>`).join('')}</select></div></div>${wizardNav()}</div>`;
if(d.step===4)return `<div><div class="alert" style="margin-bottom:14px"><b>Selection rule:</b> You may inspect any package, but only an <b>approved</b> rate card can be used to generate a customer quotation.</div><div class="grid cols-2">${packages.map(p=>packageCard(d.city,p,d.package===p)).join('')}</div>${wizardNav()}</div>`;
if(d.step===5){const allowOverride=can('quote.commercial.override');return `<div class="card pad"><h3>Commercial controls</h3><div class="form-grid three"><div class="field"><label>Contingency %</label><input class="input draft-input" data-k="contingency" type="number" value="${d.contingency}" ${allowOverride?'':'disabled'}></div><div class="field"><label>Margin %</label><input class="input draft-input" data-k="margin" type="number" value="${d.margin}" ${allowOverride?'':'disabled'}></div><div class="field"><label>Discount ₹</label><input class="input draft-input" data-k="discount" type="number" value="${d.discount}" ${can('quote.edit')?'':'disabled'}></div></div>${!allowOverride?'<p class="small muted">Your role cannot override rate-card margin or contingency. Values are inherited from the approved card.</p>':''}<h3 style="margin-top:22px">Optional scope</h3>${d.addons.map((a,i)=>`<div class="check-row"><input type="checkbox" ${a.selected?'checked':''} onchange="toggleAddon(${i},this.checked)"><span>${esc(a.name)}</span><input class="input amount" type="number" value="${a.amount}" onchange="setAddonAmount(${i},this.value)" ${a.selected?'':'disabled'}></div>`).join('')}<div class="row" style="margin-top:13px"><input class="input" id="customName" placeholder="Custom line item" style="flex:1"><input class="input" id="customAmount" type="number" placeholder="Amount" style="width:150px"><button class="btn" onclick="addCustomAddon()">Add</button></div>${d.customAddons.map((a,i)=>`<div class="kv"><span>${esc(a.name)}</span><span><b>${money(a.amount)}</b> <button class="btn sm danger" onclick="removeCustom(${i})">Remove</button></span></div>`).join('')}<div class="row" style="margin-top:18px"><label><input type="checkbox" ${d.gstEnabled?'checked':''} onchange="setGst(this.checked)"> Apply GST</label>${d.gstEnabled?`<input class="input draft-input" data-k="gst" type="number" value="${d.gst}" style="width:100px">`:''}</div>${wizardNav()}</div>`}
return `<div class="card pad"><h3>Review & generate</h3>${quoteReadiness(d,c)}<div style="margin-top:14px">${breakdown(c)}</div><div class="field" style="margin-top:16px"><label>Internal quote note</label><textarea class="input draft-input" data-k="notes">${esc(d.notes)}</textarea></div><div class="row" style="margin-top:18px"><button class="btn" onclick="prevStep()">Back</button><button class="btn primary" onclick="generateQuote()" ${quoteReady(d,c)?'':'disabled'}>Generate Governed Quote</button></div></div>`}
function wizardNav(){return `<div class="row" style="justify-content:space-between;margin-top:20px"><button class="btn" onclick="prevStep()">Back</button><button class="btn primary" onclick="nextStep()">Continue</button></div>`}
function packageCard(city,p,selected){const r=state.rateCards[city][p];return `<div class="card package ${selected?'selected':''}" onclick="choosePackage('${p.replaceAll("'","\\'")}')"><div class="row" style="justify-content:space-between"><h4>${esc(p)}</h4>${badge(r.status)}</div><div class="rate">${money(r.expected)} <span class="small muted">/ sq.ft.</span></div><div class="range">Range ${money(r.min)}–${money(r.max)} · v${r.version}</div><p class="small muted">${esc(r.sourceQuality)}</p></div>`}
function quoteReady(d,c){return !!(d.customer&&/^\d{10}$/.test(String(d.phone).replace(/\D/g,''))&&+d.area>0&&c.rc&&c.rc.status==='approved')}
function quoteReadiness(d,c){const rows=[['Customer name',!!d.customer],['10-digit mobile',/^\d{10}$/.test(String(d.phone).replace(/\D/g,''))],['Valid built-up area',+d.area>0],['Approved rate card',!!(c.rc&&c.rc.status==='approved')],['Site enrichment','optional']];return `<div class="grid cols-2">${rows.map(([x,v])=>`<div class="kv"><span>${esc(x)}</span>${v==='optional'?badge(d.siteVerified?'Verified':'Optional'):badge(v?'Pass':'Blocked')}</div>`).join('')}</div>`}
function breakdown(c){return `<div class="kv"><span>Base amount</span><b>${money(c.base)}</b></div><div class="kv"><span>Scope adjustments</span><b>${money(c.scope)}</b></div><div class="kv"><span>Contingency</span><b>${money(c.contingency)}</b></div><div class="kv"><span>Margin</span><b>${money(c.margin)}</b></div><div class="kv"><span>Taxable amount</span><b>${money(c.taxable)}</b></div><div class="kv"><span>GST</span><b>${money(c.gst)}</b></div><div class="kv"><span>Discount</span><b>− ${money(c.discount)}</b></div><div class="kv" style="font-size:17px"><span><b>Final quote amount</b></span><b>${money(c.final)}</b></div>`}
function afterRender(){document.querySelectorAll('.draft-input').forEach(el=>el.addEventListener('change',e=>{const k=e.target.dataset.k;const numeric=['area','margin','contingency','gst','discount','validity'].includes(k);state.draft[k]=numeric?+e.target.value:e.target.value;if(k==='city'){state.draft.package='Standard Turnkey';inheritRateDefaults()}save();render()}))}
function inheritRateDefaults(){const r=currentRate();if(r){state.draft.margin=r.margin;state.draft.contingency=r.contingency}}
function setStep(n){state.draft.step=Math.max(1,Math.min(6,n));save();render()}
function nextStep(){const d=state.draft;if(d.step===1&&(!d.customer||!/^\d{10}$/.test(String(d.phone).replace(/\D/g,''))))return toast('Add customer name and a 10-digit mobile');if(d.step===3&&(!d.area||d.area<=0))return toast('Enter a valid built-up area');d.step=Math.min(6,d.step+1);save();render()}
function prevStep(){state.draft.step=Math.max(1,state.draft.step-1);save();render()}
function saveDraft(){save();audit('DRAFT_SAVED','draft',state.draft.id,`Draft saved for ${state.draft.customer}`);toast('Draft saved')}
function choosePackage(p){state.draft.package=p;inheritRateDefaults();save();render()}
function toggleAddon(i,v){state.draft.addons[i].selected=v;save();render()}
function setAddonAmount(i,v){state.draft.addons[i].amount=+v;save();render()}
function addCustomAddon(){const n=document.getElementById('customName'),a=document.getElementById('customAmount');if(!n?.value||!+a?.value)return toast('Add a line-item name and amount');state.draft.customAddons.push({name:n.value,amount:+a.value});save();render()}
function removeCustom(i){state.draft.customAddons.splice(i,1);save();render()}
function setGst(v){state.draft.gstEnabled=v;save();render()}
async function fetchJson(url,{timeout=6500,cacheKey=null}={}){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),timeout);try{const res=await fetch(url,{headers:{'Accept':'application/json'},signal:ctrl.signal});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();if(cacheKey){state.apiCache[cacheKey]={at:new Date().toISOString(),url,data};save()}return{data,source:'live'}}catch(err){if(cacheKey&&state.apiCache[cacheKey])return{data:state.apiCache[cacheKey].data,source:'cached',error:String(err.message||err)};throw err}finally{clearTimeout(timer)}}
async function lookupPincode(){const pin=String(state.draft.pincode||'').trim();const host=document.getElementById('siteApiStatus');if(!/^\d{6}$/.test(pin)){if(host)host.innerHTML='<div class="alert red">Enter a valid 6-digit Indian PIN code.</div>';return}if(host)host.innerHTML='<div class="alert blue">Checking Postal PIN Code API…</div>';try{const {data,source}=await fetchJson(`https://api.postalpincode.in/pincode/${encodeURIComponent(pin)}`,{cacheKey:'pin:'+pin});const root=Array.isArray(data)?data[0]:null;if(!root||String(root.Status).toLowerCase()!=='success'||!root.PostOffice?.length)throw new Error('PIN not found');const po=root.PostOffice[0];state.draft.postOffice=po.Name||'';state.draft.district=po.District||'';state.draft.stateName=po.State||'';state.draft.siteVerified=true;save();audit('PIN_VALIDATED','project',state.draft.id,`${pin} → ${po.District}, ${po.State} (${source})`);render()}catch(e){if(host)host.innerHTML=`<div class="alert red"><b>PIN lookup unavailable.</b> ${esc(e.message)}. Manual site data remains enabled.</div>`}}
async function geocodeSite(){const d=state.draft;const q=[d.address,d.locality,d.city,d.stateName,d.pincode,'India'].filter(Boolean).join(', ');const host=document.getElementById('siteApiStatus');if(!q.trim())return toast('Add an address or locality first');if(host)host.innerHTML='<div class="alert blue">Resolving site with Nominatim…</div>';try{const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=3&countrycodes=in&q=${encodeURIComponent(q)}`;const {data,source}=await fetchJson(url,{cacheKey:'geo:'+q.toLowerCase()});if(!Array.isArray(data)||!data.length)throw new Error('No matching site found');const x=data[0];d.latitude=Number(x.lat);d.longitude=Number(x.lon);d.geocodeLabel=x.display_name||q;d.siteVerified=true;save();audit('SITE_GEOCODED','project',d.id,`${d.geocodeLabel} (${source})`);render()}catch(e){if(host)host.innerHTML=`<div class="alert red"><b>Geocoding unavailable.</b> ${esc(e.message)}. The quote can continue with the manually entered site.</div>`}}
async function loadWeather(){const d=state.draft;const host=document.getElementById('siteApiStatus');if(!(Number.isFinite(+d.latitude)&&Number.isFinite(+d.longitude)))return toast('Resolve site coordinates first');if(host)host.innerHTML='<div class="alert blue">Loading 5-day site forecast…</div>';try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(d.latitude)}&longitude=${encodeURIComponent(d.longitude)}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=5`;const {data,source}=await fetchJson(url,{cacheKey:`wx:${(+d.latitude).toFixed(3)},${(+d.longitude).toFixed(3)}`});d.weather={source,at:new Date().toISOString(),daily:data.daily};save();audit('WEATHER_LOADED','project',d.id,`5-day forecast (${source})`);render()}catch(e){if(host)host.innerHTML=`<div class="alert red"><b>Weather unavailable.</b> ${esc(e.message)}. Pricing and quote generation are unaffected.</div>`}}
function siteContext(d){let html='';if(d.geocodeLabel)html+=`<div class="alert green"><b>Site resolved:</b> ${esc(d.geocodeLabel)}<br><span class="small">${d.latitude}, ${d.longitude}</span></div>`;else if(d.siteVerified)html+=`<div class="alert green"><b>PIN validated:</b> ${esc(d.postOffice)} · ${esc(d.district)} · ${esc(d.stateName)}</div>`;if(d.weather?.daily?.time){html+=`<div style="margin-top:10px"><div class="weather-grid">${d.weather.daily.time.map((t,i)=>`<div class="weather-day"><b>${esc(t.slice(5))}</b><div class="small muted">${Math.round(d.weather.daily.temperature_2m_min?.[i]??0)}–${Math.round(d.weather.daily.temperature_2m_max?.[i]??0)}°C</div><div class="small">Rain ${Math.round(d.weather.daily.precipitation_probability_max?.[i]??0)}%</div></div>`).join('')}</div><p class="tiny muted">Weather is planning context only · source ${esc(d.weather.source)}</p></div>`}return html||'<div class="small muted">No live site context loaded. Manual data is valid for prototype use.</div>'}
function generateQuote(){if(state.draft?.__previousQuoteId)return generateRevision();if(!requirePerm('quote.create','generate a quote'))return;const d=state.draft,c=calc(d);if(!quoteReady(d,c))return toast('Quote is blocked until required fields and an approved rate card are present');const id='Q-'+(++state.lastQuoteId);const snap=JSON.parse(JSON.stringify(c.rc));const frozenCalc=calcWithRate(d,snap);const q={id,rootId:id,revision:1,customer:d.customer,phone:String(d.phone).replace(/\D/g,''),email:d.email,city:d.city,locality:d.locality,area:d.area,floors:d.floors,package:d.package,amount:frozenCalc.final,status:'Draft',updated:new Date().toISOString(),validity:d.validity,timeline:d.timeline,calculation:frozenCalc,rateSnapshot:snap,draft:JSON.parse(JSON.stringify(d)),history:[{at:new Date().toISOString(),action:'Created',user:currentUser().name}]};state.quotes.unshift(q);upsertCustomerFromDraft(d);currentQuoteId=id;state.draft=newDraft();save();audit('QUOTE_CREATED','quote',id,`${q.customer} · ${q.package} · ${money(q.amount)} using ${snap.id} v${snap.version}`);go('preview')}
function upsertCustomerFromDraft(d){let c=state.customers.find(x=>x.phone===String(d.phone).replace(/\D/g,''));if(!c){c={id:uid('cust'),name:d.customer,phone:String(d.phone).replace(/\D/g,''),email:d.email,city:d.city,project:d.constructionType,area:d.area,status:'Quoted',notes:'',followup:plusDays(3)};state.customers.unshift(c)}else{c.name=d.customer;c.city=d.city;c.area=d.area;c.status=c.status==='Lead'?'Quoted':c.status}}
function openQuote(id){const q=state.quotes.find(x=>x.id===id);if(!q)return toast('Quote not found');currentQuoteId=id;go('preview')}
function currentQuote(){return state.quotes.find(q=>q.id===currentQuoteId)||state.quotes[0]||null}
function preview(){const q=currentQuote();if(!q)return `<div class="empty"><h2>No quotation selected</h2><p>Create or select a quotation first.</p>${can('quote.create')?'<button class="btn primary" onclick="startNew()">Create Quote</button>':'<button class="btn" onclick="go(\'quotes\')">Back to Quotes</button>'}</div>`;const d=q.draft,c=q.calculation;return `<div class="page-head"><div><h2>${esc(q.id)} · Quote preview</h2><p>Revision ${q.revision}. Rate snapshot: ${esc(q.rateSnapshot.city)} / ${esc(q.rateSnapshot.package)} v${q.rateSnapshot.version}.</p></div><div class="row preview-actions">${can('quote.revise')?'<button class="btn" onclick="editAsRevision()">Create Revision</button>':''}<button class="btn" onclick="window.print()">Print / Save PDF</button>${can('quote.share')?'<button class="btn wa" onclick="go(\'share\')">Share on WhatsApp</button>':''}</div></div>${trust()}${quoteLifecycleControls(q)}<article class="quote-paper"><div class="quote-header"><div><p class="small muted">HOUSE CONSTRUCTION QUOTATION</p><h2 class="quote-title">${esc(state.settings.company)}</h2><p>GSTIN: ${esc(state.settings.gstNumber)}</p></div><div><b>${esc(q.id)}</b><br><span class="muted">Revision ${q.revision} · ${esc(q.status)} · Valid ${q.validity} days</span></div></div><div class="grid cols-2"><div><h3>Prepared for</h3><b>${esc(q.customer)}</b><p>${esc(q.phone)}<br>${esc(d.locality)}, ${esc(d.city)} ${esc(d.pincode||'')}</p></div><div class="quote-total"><span>Quotation total</span><strong>${money(c.final)}</strong><span>${money(c.effective)} / sq.ft.</span></div></div><div class="paper-section"><h3>Project & package</h3><div class="grid cols-3"><div><span class="small muted">Built-up area</span><br><b>${Number(d.area).toLocaleString('en-IN')} sq.ft.</b></div><div><span class="small muted">Floors / timeline</span><br><b>${esc(d.floors)} · ${esc(d.timeline)}</b></div><div><span class="small muted">Package</span><br><b>${esc(d.package)}</b></div></div></div><div class="paper-section"><h3>Cost breakup</h3>${breakdown(c)}</div><div class="paper-section"><h3>Assumptions</h3><p>${esc(state.templates.assumptions)}</p></div><div class="paper-section"><h3>Exclusions</h3><ul class="paper-list">${q.rateSnapshot.excluded.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="paper-section"><h3>Payment milestones</h3><table><tbody>${d.milestones.map(m=>`<tr><td>${esc(m[0])}</td><td style="text-align:right">${m[1]}%</td><td style="text-align:right"><b>${money(c.final*m[1]/100)}</b></td></tr>`).join('')}</tbody></table></div><div class="paper-section"><h3>Terms</h3><p>Timeline: ${esc(d.timeline)} · Quote validity: ${d.validity} days.</p><p>${esc(state.templates.escalation)}</p><p class="small muted">Pricing is based on the approved rate-card snapshot above and listed assumptions. Final pricing may change after site visit, design confirmation, material selection, statutory requirements and scope changes.</p></div><div class="signature"><div>For ${esc(state.settings.company)}</div><div>Customer acceptance</div></div><p class="small muted" style="text-align:center;margin-top:35px">${esc(state.settings.footer)}</p></article>`}
function quoteLifecycleControls(q){if(!can('quote.status'))return `<div class="alert blue no-print" style="margin-bottom:15px"><b>Status:</b> ${esc(q.status)}. Your role has read-only lifecycle access.</div>`;return `<div class="card pad no-print" style="margin-bottom:15px"><div class="row"><b>Lifecycle</b>${['Draft','Sent','Won','Lost'].map(s=>`<button class="btn sm ${q.status===s?'dark':''}" onclick="setQuoteStatus('${s}')">${s}</button>`).join('')}</div></div>`}
function setQuoteStatus(s){if(!requirePerm('quote.status','change quote status'))return;const q=currentQuote();if(!q)return;const prev=q.status;q.status=s;q.updated=new Date().toISOString();q.history.unshift({at:new Date().toISOString(),action:`Status ${prev} → ${s}`,user:currentUser().name});const c=state.customers.find(x=>x.phone===q.phone);if(c&&['Won','Lost'].includes(s))c.status=s;save();audit('QUOTE_STATUS','quote',q.id,`${prev} → ${s}`);render();toast(`Quote marked ${s}`)}
function editAsRevision(){if(!requirePerm('quote.revise','revise a quote'))return;const q=currentQuote();if(!q)return;state.draft=JSON.parse(JSON.stringify(q.draft));state.draft.id=uid('draft');state.draft.step=6;state.draft.__revisionOf=q.rootId;state.draft.__previousQuoteId=q.id;save();audit('REVISION_STARTED','quote',q.id,'Revision draft opened');go('wizard')}
function generateRevision(){if(!requirePerm('quote.revise','revise a quote'))return;const d=state.draft,prev=state.quotes.find(x=>x.id===d.__previousQuoteId);const c=calc(d);if(!prev||!quoteReady(d,c))return toast('Revision blocked until an approved rate card and required fields are present');const rev=Math.max(...state.quotes.filter(x=>x.rootId===prev.rootId).map(x=>x.revision))+1;const id=`${prev.rootId}-R${rev}`;const snap=JSON.parse(JSON.stringify(c.rc));const frozen=calcWithRate(d,snap);delete d.__revisionOf;delete d.__previousQuoteId;const q={id,rootId:prev.rootId,revision:rev,customer:d.customer,phone:String(d.phone).replace(/\D/g,''),email:d.email,city:d.city,locality:d.locality,area:d.area,floors:d.floors,package:d.package,amount:frozen.final,status:'Draft',updated:new Date().toISOString(),validity:d.validity,timeline:d.timeline,calculation:frozen,rateSnapshot:snap,draft:JSON.parse(JSON.stringify(d)),history:[{at:new Date().toISOString(),action:`Revision from ${prev.id}`,user:currentUser().name}]};state.quotes.unshift(q);currentQuoteId=id;state.draft=newDraft();save();audit('QUOTE_REVISED','quote',id,`Created from ${prev.id}; amount delta ${money(q.amount-prev.amount)}`);go('preview')}
function whatsappText(q=currentQuote()){if(!q)return'';const d=q.draft,c=q.calculation;return `Hello ${d.customer},\n\nSharing quotation ${q.id} for your ${d.floors} house construction at ${d.locality}, ${d.city}.\n\nBuilt-up area: ${Number(d.area).toLocaleString('en-IN')} sq.ft.\nPackage: ${d.package}\nQuotation: ${money(c.final)}\nValidity: ${q.validity} days\n\nThe quotation is based on the listed scope and approved local rate card. Final scope remains subject to site/design confirmation.\n\nRegards,\n${state.settings.company}`}
function share(){const q=currentQuote();if(!q)return `<div class="empty"><h2>No quote available to share</h2><button class="btn" onclick="go('quotes')">Quotes</button></div>`;if(!can('quote.share'))return '<div class="alert red">Your role cannot share customer quotations.</div>';const txt=whatsappText(q);return `<div class="page-head"><div><h2>WhatsApp share</h2><p>Customer-safe message generated from the frozen quotation facts. No pricing is invented by the Copilot.</p></div><button class="btn" onclick="go('preview')">Back to quote</button></div><div class="card pad"><div class="wa-card">${esc(txt)}</div><div class="row" style="margin-top:15px"><button class="btn" onclick="copyWhatsApp()">Copy Message</button><button class="btn wa" onclick="openWhatsApp()">Open WhatsApp</button></div></div>`}
function copyWhatsApp(){const t=whatsappText();navigator.clipboard?.writeText(t).then(()=>toast('Copied to clipboard')).catch(()=>toast('Clipboard unavailable; select the message manually'))}
function openWhatsApp(){if(!requirePerm('quote.share','share a quote'))return;const q=currentQuote();if(!q)return;const phone=String(q.phone).replace(/\D/g,'');const target=phone.length===10?'91'+phone:phone;const url=`https://wa.me/${target}?text=${encodeURIComponent(whatsappText(q))}`;const prev=q.status;q.status='Sent';q.updated=new Date().toISOString();save();audit('QUOTE_SHARED','quote',q.id,`WhatsApp opened; status ${prev} → Sent`);window.open(url,'_blank','noopener');toast('WhatsApp opened and quote marked Sent')}
function customers(){return `<div class="page-head"><div><h2>Customers / leads</h2><p>Keep quotation history, follow-up date, notes and outcome tied to the customer rather than a spreadsheet row.</p></div>${can('quote.create')?'<button class="btn primary" onclick="startNew()">Create Quote</button>':''}</div><div class="card table-wrap"><table><thead><tr><th>Customer</th><th>City</th><th>Project</th><th>Status</th><th>Follow-up</th><th></th></tr></thead><tbody>${state.customers.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.phone)}</div></td><td>${esc(c.city)}</td><td>${esc(c.project)} · ${Number(c.area||0).toLocaleString('en-IN')} sq.ft.</td><td>${badge(c.status)}</td><td>${esc(c.followup||'Not set')}</td><td><button class="btn sm" onclick="customerProfile('${c.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function customerProfile(id){const c=state.customers.find(x=>x.id===id);if(!c)return;const qs=state.quotes.filter(x=>x.phone===c.phone);const editable=can('customers.edit');document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal"><div class="modal-head"><div><b>${esc(c.name)}</b><div class="small muted">${esc(c.phone)} · ${esc(c.city)}</div></div><button class="btn sm" onclick="closeModal()">Close</button></div><div class="pad"><h3>Quote history</h3>${quoteTable(qs)}<h3 style="margin-top:22px">Notes & follow-up</h3><textarea class="input" id="custNotes" ${editable?'':'disabled'}>${esc(c.notes||'')}</textarea><div class="form-grid" style="margin-top:10px"><div class="field"><label>Follow-up date</label><input type="date" class="input" id="custFollow" value="${esc(c.followup||'')}" ${editable?'':'disabled'}></div><div class="field"><label>Customer status</label><select class="input" id="custStatus" ${editable?'':'disabled'}>${['Lead','Quoted','Sent','Won','Lost'].map(x=>`<option ${x===c.status?'selected':''}>${x}</option>`).join('')}</select></div></div>${editable?`<button class="btn primary" style="margin-top:12px" onclick="saveCustomer('${c.id}')">Save customer</button>`:''}</div></div></div>`}
function saveCustomer(id){if(!requirePerm('customers.edit','edit customer data'))return;const c=state.customers.find(x=>x.id===id);c.notes=document.getElementById('custNotes').value;c.followup=document.getElementById('custFollow').value;c.status=document.getElementById('custStatus').value;save();audit('CUSTOMER_UPDATED','customer',id,`Status ${c.status}; follow-up ${c.followup||'none'}`);closeModal();render();toast('Customer saved')}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalRoot').innerHTML=''}
function ratecards(){const rc=state.rateCards[rateCity][ratePkg];const edit=can('rates.edit');const approve=can('rates.approve');return `<div class="page-head"><div><h2>Rate-card governance</h2><p>Draft → validated → approved. Customer quote generation checks the status at runtime and freezes the exact approved version used.</p></div><div class="row">${edit?'<button class="btn dark" onclick="saveRateCard()">Save Rate Card</button>':''}${approve?'<button class="btn primary" onclick="approveRateCard()">Approve</button>':''}</div></div>${trust()}<div class="tabs" style="margin-bottom:10px">${cities.map(c=>`<button class="${c===rateCity?'active':''}" onclick="setRateCity('${c}')">${c}</button>`).join('')}</div><div class="tabs" style="margin-bottom:16px">${packages.map(p=>`<button class="${p===ratePkg?'active':''}" onclick="setRatePkg('${p.replaceAll("'","\\'")}')">${p}</button>`).join('')}</div>${rc.status!=='approved'?'<div class="alert red" style="margin-bottom:16px"><b>Not customer-usable:</b> this rate card cannot generate a new quotation until approved.</div>':''}<div class="grid cols-3" style="margin-bottom:16px"><div class="card kpi"><div class="label">Expected rate</div><div class="value">${money(rc.expected)}<small style="font-size:12px"> / sq.ft.</small></div><div class="meta">Range ${money(rc.min)}–${money(rc.max)}</div></div><div class="card kpi"><div class="label">Version</div><div class="value">v${rc.version}</div><div class="meta">${badge(rc.status)} · ${rc.validators} validator(s)</div></div><div class="card kpi"><div class="label">Review due</div><div class="value" style="font-size:20px;margin-top:10px">${esc(rc.reviewDue)}</div><div class="meta">${esc(rc.sourceQuality)}</div></div></div><div class="card pad"><div class="form-grid three"><div class="field"><label>Minimum rate / sq.ft.</label><input id="rcMin" class="input" type="number" value="${rc.min}" ${edit?'':'disabled'}></div><div class="field"><label>Expected rate / sq.ft.</label><input id="rcExpected" class="input" type="number" value="${rc.expected}" ${edit?'':'disabled'}></div><div class="field"><label>Maximum rate / sq.ft.</label><input id="rcMax" class="input" type="number" value="${rc.max}" ${edit?'':'disabled'}></div><div class="field"><label>Default margin %</label><input id="rcMargin" class="input" type="number" value="${rc.margin}" ${edit?'':'disabled'}></div><div class="field"><label>Default contingency %</label><input id="rcCont" class="input" type="number" value="${rc.contingency}" ${edit?'':'disabled'}></div><div class="field"><label>Validator count</label><input id="rcValidators" class="input" type="number" value="${rc.validators}" ${edit?'':'disabled'}></div><div class="field"><label>Source quality</label><input id="rcSource" class="input" value="${esc(rc.sourceQuality)}" ${edit?'':'disabled'}></div><div class="field"><label>Review due</label><input id="rcReview" class="input" type="date" value="${esc(rc.reviewDue)}" ${edit?'':'disabled'}></div><div class="field"><label>Status</label><select id="rcStatus" class="input" ${edit?'':'disabled'}><option value="draft" ${rc.status==='draft'?'selected':''}>Draft</option><option value="validated" ${rc.status==='validated'?'selected':''}>Validated</option><option value="approved" ${rc.status==='approved'?'selected':''} ${approve?'':'disabled'}>Approved</option></select></div><div class="field" style="grid-column:span 3"><label>Evidence / source URLs / validation note *</label><textarea id="rcUrls" class="input" ${edit?'':'disabled'}>${esc(rc.sourceUrls)}</textarea></div><div class="field" style="grid-column:span 3"><label>Labour / material notes</label><textarea id="rcNotes" class="input" ${edit?'':'disabled'}>${esc(rc.labourNotes)}</textarea></div></div></div><div class="card" style="margin-top:16px"><div class="card-head"><h3>Version / approval history</h3></div><div class="pad timeline">${[...(rc.history||[])].reverse().map(h=>`<div class="timeline-item"><b>v${h.version} · ${esc(h.status)}</b><div class="small muted">${esc(h.at)} · ${esc(h.by)}</div></div>`).join('')}</div></div>`}
function setRateCity(c){rateCity=c;render()}function setRatePkg(p){ratePkg=p;render()}
function readRateForm(){return{min:+document.getElementById('rcMin').value,expected:+document.getElementById('rcExpected').value,max:+document.getElementById('rcMax').value,margin:+document.getElementById('rcMargin').value,contingency:+document.getElementById('rcCont').value,validators:+document.getElementById('rcValidators').value,sourceQuality:document.getElementById('rcSource').value.trim(),reviewDue:document.getElementById('rcReview').value,status:document.getElementById('rcStatus').value,sourceUrls:document.getElementById('rcUrls').value.trim(),labourNotes:document.getElementById('rcNotes').value.trim()}}
function saveRateCard(){if(!requirePerm('rates.edit','edit rate cards'))return;const r=state.rateCards[rateCity][ratePkg],v=readRateForm();if(!(v.min>0&&v.expected>=v.min&&v.max>=v.expected))return toast('Rates must satisfy min ≤ expected ≤ max');if(v.status==='approved'&&!can('rates.approve'))v.status='validated';Object.assign(r,v);r.version+=1;r.history.push({version:r.version,status:r.status,at:new Date().toISOString(),by:currentUser().name});save();audit('RATE_UPDATED','ratecard',r.id,`${r.city} / ${r.package} v${r.version} · ${r.status}`);render();toast('Rate card saved as a new version')}
function approveRateCard(){if(!requirePerm('rates.approve','approve rate cards'))return;const r=state.rateCards[rateCity][ratePkg],form=readRateForm();if(!(form.min>0&&form.expected>=form.min&&form.max>=form.expected))return toast('Fix the rate range before approval');if(!form.sourceUrls||form.validators<1)return toast('Approval requires evidence and at least one validator');Object.assign(r,form,{status:'approved'});r.version+=1;r.history.push({version:r.version,status:'approved',at:new Date().toISOString(),by:currentUser().name});save();audit('RATE_APPROVED','ratecard',r.id,`${r.city} / ${r.package} v${r.version} approved`);render();toast('Rate card approved and available for new quotes')}
function templates(){const edit=can('templates.edit');return `<div class="page-head"><div><h2>Customer language templates</h2><p>Templates control wording, not the numeric quotation. Generated messages are grounded in saved quote facts.</p></div>${edit?'<button class="btn primary" onclick="saveTemplates()">Save Templates</button>':''}</div><div class="grid cols-2">${Object.entries({assumptions:'Assumptions',exclusions:'Default exclusions',validity:'Validity terms',escalation:'Escalation note',whatsapp:'WhatsApp guidance'}).map(([k,l])=>`<div class="card pad field"><label>${l}</label><textarea class="input template-input" data-k="${k}" ${edit?'':'disabled'}>${esc(state.templates[k])}</textarea></div>`).join('')}</div>`}
function saveTemplates(){if(!requirePerm('templates.edit','edit templates'))return;document.querySelectorAll('.template-input').forEach(x=>state.templates[x.dataset.k]=x.value);save();audit('TEMPLATES_UPDATED','settings','templates','Customer language templates updated');toast('Templates saved')}
function analytics(){const q=state.quotes,total=q.reduce((a,b)=>a+b.amount,0),avg=q.length?total/q.length:0;const approved=cities.flatMap(c=>packages.map(p=>state.rateCards[c][p])).filter(x=>x.status==='approved').length;return `<div class="page-head"><div><h2>Quotation analytics</h2><p>Operational throughput and commercial outcomes. Demo analytics are derived from the application state, not hard-coded KPIs.</p></div></div><div class="grid cols-4" style="margin-bottom:16px"><div class="card kpi"><div class="label">Quotes created</div><div class="value">${q.length}</div></div><div class="card kpi"><div class="label">Quote value</div><div class="value" style="font-size:22px">${money(total)}</div></div><div class="card kpi"><div class="label">Average quote</div><div class="value" style="font-size:22px">${money(avg)}</div></div><div class="card kpi"><div class="label">Approved rates</div><div class="value">${approved}</div></div></div><div class="grid cols-3"><div class="card pad"><h3>Status funnel</h3>${bars(['Draft','Sent','Won','Lost'].map(s=>[s,quoteStatusCount(s)]))}</div><div class="card pad"><h3>City mix</h3>${bars(cities.map(c=>[c,q.filter(x=>x.city===c).length]))}</div><div class="card pad"><h3>Package mix</h3>${bars(packages.map(p=>[p,q.filter(x=>x.package===p).length]))}</div></div>`}
function bars(rows){const max=Math.max(1,...rows.map(x=>x[1]));return rows.map(x=>`<div style="margin:13px 0"><div class="row" style="justify-content:space-between"><span class="small">${esc(x[0])}</span><b>${x[1]}</b></div><div class="bar"><i style="width:${x[1]/max*100}%"></i></div></div>`).join('')}
function copilot(){return `<div class="page-head"><div><h2>Quotation Copilot</h2><p>Deterministic, grounded assistant for quote explanations and operational questions. It does not invent construction rates.</p></div></div><div class="card"><div class="copilot-thread" id="copilotThread">${state.copilot.map(m=>`<div class="msg ${m.from==='user'?'user':'bot'}">${esc(m.text)}</div>`).join('')}</div><div class="pad"><div class="row"><input class="input" id="copilotInput" placeholder="Ask: Why is Q-1024 blocked? Which follow-ups are due? What can Sales do?" style="flex:1" onkeydown="if(event.key==='Enter')askCopilot()"><button class="btn primary" onclick="askCopilot()">Ask</button></div><div class="row" style="margin-top:9px"><button class="btn sm" onclick="quickAsk('Which follow-ups are due?')">Follow-ups</button><button class="btn sm" onclick="quickAsk('Which rate cards are approved?')">Rate status</button><button class="btn sm" onclick="quickAsk('What can my role do?')">My access</button></div></div></div>`}
function quickAsk(q){const i=document.getElementById('copilotInput');i.value=q;askCopilot()}
function askCopilot(){if(!requirePerm('copilot.use','use Copilot'))return;const i=document.getElementById('copilotInput'),q=(i?.value||'').trim();if(!q)return;state.copilot.push({id:uid('m'),from:'user',text:q});state.copilot.push({id:uid('m'),from:'bot',text:copilotAnswer(q)});state.copilot=state.copilot.slice(-40);save();audit('COPILOT_QUERY','copilot','session',q);render();setTimeout(()=>document.getElementById('copilotThread')?.scrollTo(0,99999),0)}
function copilotAnswer(q){const s=q.toLowerCase();if(s.includes('follow')){const due=state.customers.filter(c=>c.followup&&c.followup<=plusDays(3)&&!['Won','Lost'].includes(c.status));return due.length?`Due / near-term follow-ups:\n${due.map(c=>`• ${c.name} — ${c.followup} — ${c.status}`).join('\n')}`:'No customer follow-ups are due in the next three days.'}if(s.includes('rate')||s.includes('approved')){const a=cities.flatMap(c=>packages.map(p=>state.rateCards[c][p])).filter(r=>r.status==='approved');return `Approved rate cards (${a.length}):\n${a.map(r=>`• ${r.city} / ${r.package}: ${money(r.expected)}/sq.ft. (v${r.version})`).join('\n')||'None'}\n\nI will not infer a price from non-approved cards.`}if(s.includes('role')||s.includes('access')||s.includes('permission')){const u=currentUser();const perms=ROLES[u.role].perms.includes('*')?ALL_PERMS:ROLES[u.role].perms;return `${u.name} is ${ROLES[u.role].label}.\nAllowed capabilities include: ${perms.join(', ')}.`}const id=(q.match(/q-\d+(?:-r\d+)?/i)||[])[0];if(id){const x=state.quotes.find(z=>z.id.toLowerCase()===id.toLowerCase());if(!x)return `I cannot find ${id} in this workspace.`;return `${x.id} is ${x.status} for ${x.customer}. Amount ${money(x.amount)} from ${x.area} sq.ft. × approved ${x.rateSnapshot.city}/${x.rateSnapshot.package} rate snapshot v${x.rateSnapshot.version}, plus listed scope, contingency, margin, GST if enabled, and discount. Historical pricing is frozen to that snapshot.`}if(s.includes('blocked')||s.includes('why')){const r=currentRate();if(r?.status!=='approved')return `The current draft is blocked because ${r.city} / ${r.package} is ${r.status}, not approved. A Rate Manager or Owner must supply evidence, validation and approve the rate card before generation.`;return 'The current draft has an approved rate card. Check customer name, 10-digit mobile and built-up area if generation is still blocked.'}return 'I can answer from the current workspace about quotations, rate status, access, revisions and follow-ups. Try asking about a quote ID, approved rates, or your role.'}
function access(){const u=currentUser();return `<div class="page-head"><div><h2>Role-based access control</h2><p>Permissions are checked in both the interface and mutation functions. The role switcher is intentionally exposed for prototype testing.</p></div>${can('users.manage')?'<span class="badge purple">Owner can manage demo users</span>':''}</div><div class="card table-wrap"><table class="permission-grid"><thead><tr><th>Capability</th>${Object.values(ROLES).map(r=>`<th>${esc(r.label)}</th>`).join('')}</tr></thead><tbody>${ALL_PERMS.map(p=>`<tr><td><code>${esc(p)}</code></td>${Object.values(ROLES).map(r=>`<td class="${r.perms.includes('*')||r.perms.includes(p)?'ok':'no'}">${r.perms.includes('*')||r.perms.includes(p)?'✓':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:16px"><div class="card-head"><h3>Demo users</h3></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th>${can('users.manage')?'<th>Manage</th>':''}</tr></thead><tbody>${state.users.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="tiny muted">${esc(x.id)}</div></td><td>${badge(ROLES[x.role].label)}</td><td>${badge(x.active?'Active':'Inactive')}</td>${can('users.manage')?`<td><select class="input" style="min-width:190px" onchange="changeUserRole('${x.id}',this.value)">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===x.role?'selected':''}>${esc(r.label)}</option>`).join('')}</select><button class="btn sm ${x.active?'danger':''}" style="margin-left:6px" onclick="toggleUser('${x.id}')">${x.active?'Disable':'Enable'}</button></td>`:''}</tr>`).join('')}</tbody></table></div></div>`}
function changeUserRole(id,role){if(!requirePerm('users.manage','change user roles'))return;const x=state.users.find(u=>u.id===id);if(!x||!ROLES[role])return;const prev=x.role;x.role=role;save();audit('USER_ROLE_CHANGED','user',id,`${prev} → ${role}`);render();toast('Role updated')}
function toggleUser(id){if(!requirePerm('users.manage','enable or disable users'))return;const x=state.users.find(u=>u.id===id);if(!x)return;if(x.id===currentUserId)return toast('Cannot disable the active demo session');x.active=!x.active;save();audit('USER_STATUS_CHANGED','user',id,x.active?'Enabled':'Disabled');render()}
function auditPage(){return `<div class="page-head"><div><h2>Audit log</h2><p>Permission denials, approvals, quote lifecycle changes, sharing and customer mutations are recorded with actor and time.</p></div><button class="btn" onclick="exportAudit()">Export CSV</button></div><div class="card table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Role</th><th>Action</th><th>Entity</th><th>Detail</th></tr></thead><tbody>${state.audit.map(e=>`<tr><td class="small">${esc(new Date(e.at).toLocaleString())}</td><td><b>${esc(e.user)}</b></td><td>${esc(e.role)}</td><td>${badge(e.action)}</td><td>${esc(e.type)} ${esc(e.entityId)}</td><td>${esc(e.detail)}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No audit events yet. Try switching roles, approving a rate, or creating a quote.</div></td></tr>'}</tbody></table></div>`}
function exportAudit(){const head=['at','user','role','action','type','entityId','detail'];const csv=[head.join(','),...state.audit.map(r=>head.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','))].join('\n');downloadText('house-copilot-audit.csv',csv,'text/csv')}
function downloadText(name,text,type='text/plain'){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function apihealth(){return `<div class="page-head"><div><h2>API & QA console</h2><p>Only capabilities that improve the workflow are integrated. All external services have manual/cached fallbacks and zero pricing authority.</p></div><button class="btn primary" onclick="runSelfTests()">Run Self-tests</button></div><div class="grid cols-3">${Object.entries(API_CATALOG).map(([k,a])=>`<div class="card api-card"><span class="badge green">Selected</span><h3>${esc(a.name)}</h3><p>${esc(a.purpose)}</p><div class="api-meta"><span class="badge ${a.pricingImpact?'red':'blue'}">Pricing impact: ${a.pricingImpact?'Yes':'None'}</span>${apiCacheBadge(k)}</div><div class="row"><button class="btn sm" onclick="testApi('${k}')">Test API</button><a class="btn sm" target="_blank" rel="noopener" href="${esc(a.source)}">Docs</a></div><div id="api-${k}" class="small muted" style="margin-top:10px"></div></div>`).join('')}</div><div class="card pad" style="margin-top:16px"><h3>Why other public APIs are not wired in</h3><p class="muted">The public-apis catalogue contains many unrelated capabilities. Adding currency, news, finance, AI inference or CRM APIs would create dependencies without improving the core quotation job. The prototype deliberately follows minimum-dependency design.</p></div><div class="card pad" style="margin-top:16px"><h3>Internal regression tests</h3><div id="selfTests"><div class="muted">Run tests to verify calculations, permission gates and immutable rate snapshots.</div></div></div>`}
function apiCacheBadge(k){const keys=Object.keys(state.apiCache);const hit=keys.find(x=>k==='pincode'?x.startsWith('pin:'):k==='geocode'?x.startsWith('geo:'):x.startsWith('wx:'));return hit?badge('Cached'):'<span class="badge gray">No cache</span>'}
async function testApi(k){const host=document.getElementById('api-'+k);host.textContent='Testing…';try{if(k==='pincode'){const r=await fetchJson('https://api.postalpincode.in/pincode/751024',{timeout:5000});const ok=Array.isArray(r.data)&&String(r.data[0]?.Status).toLowerCase()==='success';if(!ok)throw new Error('Unexpected response')}else if(k==='geocode'){const r=await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&q=Bhubaneswar%2C%20India',{timeout:5000});if(!Array.isArray(r.data)||!r.data.length)throw new Error('No geocode result')}else{const r=await fetchJson('https://api.open-meteo.com/v1/forecast?latitude=20.2961&longitude=85.8245&daily=temperature_2m_max&forecast_days=1',{timeout:5000});if(!r.data?.daily)throw new Error('No forecast data')}host.innerHTML='<span class="badge green">Live test passed</span>'}catch(e){host.innerHTML=`<span class="badge red">Unavailable</span> ${esc(e.message)} · fallback remains functional`}}
function purePermission(role,p){const r=ROLES[role];return r.perms.includes('*')||r.perms.includes(p)}
function runSelfTests(){const rc=JSON.parse(JSON.stringify(state.rateCards.Bhubaneswar['Standard Turnkey']));const d=newDraft();d.area=1000;d.margin=10;d.contingency=5;d.discount=0;d.gstEnabled=false;const c=calcWithRate(d,rc);const expectedBase=1000*rc.expected;const frozen=JSON.parse(JSON.stringify(rc));const first=calcWithRate(d,frozen).final;rc.expected+=999;const second=calcWithRate(d,frozen).final;const tests=[['Estimator cannot approve rates',!purePermission('estimator','rates.approve')],['Rate Manager can approve rates',purePermission('rate_manager','rates.approve')],['Sales cannot edit rate cards',!purePermission('sales','rates.edit')],['Auditor cannot change quote status',!purePermission('auditor','quote.status')],['Base calculation = area × approved rate',c.base===expectedBase],['Frozen snapshot ignores later rate mutation',first===second],['6-digit PIN validator accepts 751024',/^\d{6}$/.test('751024')],['10-digit mobile validator rejects short input',!/^\d{10}$/.test('12345')],['Approved card is quote-eligible',rc.status==='approved']];const host=document.getElementById('selfTests');if(host)host.innerHTML=tests.map(([n,ok])=>`<div class="test-row"><span>${esc(n)}</span>${badge(ok?'Pass':'Fail')}</div>`).join('');return tests}
function settings(){const s=state.settings,edit=can('settings.edit');return `<div class="page-head"><div><h2>Organization settings</h2><p>Company identity and default commercial settings. Only Owner/Admin can mutate these prototype-level controls.</p></div>${edit?'<button class="btn primary" onclick="saveSettings()">Save Settings</button>':''}</div><div class="grid cols-2"><div class="card pad"><div class="form-grid"><div class="field"><label>Company name</label><input class="input setting" data-k="company" value="${esc(s.company)}" ${edit?'':'disabled'}></div><div class="field"><label>GSTIN</label><input class="input setting" data-k="gstNumber" value="${esc(s.gstNumber)}" ${edit?'':'disabled'}></div><div class="field"><label>Phone</label><input class="input setting" data-k="phone" value="${esc(s.phone)}" ${edit?'':'disabled'}></div><div class="field"><label>Default validity</label><input class="input setting" data-k="validity" type="number" value="${s.validity}" ${edit?'':'disabled'}></div><div class="field" style="grid-column:span 2"><label>Quote footer</label><textarea class="input setting" data-k="footer" ${edit?'':'disabled'}>${esc(s.footer)}</textarea></div></div></div><div class="card pad"><h3>Prototype data controls</h3><p class="muted">Reset restores demo users, rate cards, customers, quotes, audit history and API cache.</p>${edit?'<button class="btn danger" onclick="resetDemo()">Reset Demo Data</button>':''}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Build</h3><div class="kv"><span>App version</span><b>${APP_VERSION}</b></div><div class="kv"><span>Storage</span><b>Browser localStorage</b></div><div class="kv"><span>External pricing API</span><b>None</b></div></div></div>`}
function saveSettings(){if(!requirePerm('settings.edit','edit organization settings'))return;document.querySelectorAll('.setting').forEach(x=>state.settings[x.dataset.k]=x.type==='number'?+x.value:x.value);save();audit('SETTINGS_UPDATED','settings','organization','Organization settings updated');render();toast('Settings saved')}
function resetDemo(){if(!requirePerm('settings.edit','reset prototype data'))return;if(!confirm('Reset all House Copilot prototype data?'))return;state=seedState();currentUserId='u-owner';localStorage.setItem(SESSION_KEY,currentUserId);save();audit('DEMO_RESET','system','demo','Demo state reset');view='dashboard';render();toast('Demo reset')}
window.HQC_TEST={getState:()=>JSON.parse(JSON.stringify(state)),setUser:(id)=>switchUser(id),can:(p)=>can(p),purePermission,calcWithRate,runSelfTests,seedState,version:APP_VERSION};
render();
</script>
</body>
