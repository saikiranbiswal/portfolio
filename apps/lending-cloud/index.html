<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Lending Cloud</title>
<style>
:root {
  --bg: #0a0e14;
  --card: #0f1419;
  --card2: #151b26;
  --text: #f0f4f8;
  --muted: #8892a6;
  --accent: #e8b14c;
  --accent2: #3ec9c0;
  --danger: #f0556a;
  --success: #43d17f;
  --gold: #e8b14c;
}

* {
  box-sizing: border-box;
  font-family: "Spline Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(135deg, #0a0e14 0%, #0f1419 50%, #151b26 100%);
  color: var(--text);
  padding: 0;
  overflow: hidden;
}

#app {
  display: flex;
  height: 100vh;
}

/* Sidebar */
#sidebar {
  width: 240px;
  background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
  overflow-y: auto;
}

.logo {
  padding: 0 20px 30px;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  margin-bottom: 20px;
}

.nav-item {
  padding: 12px 20px;
  cursor: pointer;
  border-left: 3px solid transparent;
  color: var(--muted);
  transition: all 0.2s;
  position: relative;
  user-select: none;
}

.nav-item:hover {
  background: rgba(232, 177, 76, 0.08);
  color: var(--text);
}

.nav-item.active {
  background: rgba(232, 177, 76, 0.12);
  border-left-color: var(--gold);
  color: var(--gold);
}

.nav-badge {
  position: absolute;
  right: 20px;
  top: 12px;
  background: var(--danger);
  color: white;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 999px;
  font-weight: 600;
}

/* Main */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Topbar */
#topbar {
  background: linear-gradient(90deg, rgba(15, 20, 25, 0.8), rgba(21, 27, 38, 0.8));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.search-box {
  flex: 0 1 300px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
}

.search-box::placeholder {
  color: var(--muted);
}

.topbar-buttons {
  display: flex;
  gap: 12px;
}

button {
  background: var(--gold);
  color: var(--bg);
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
}

button:hover {
  background: #f0a93b;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(232, 177, 76, 0.25);
}

button.secondary {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

button.secondary:hover {
  background: rgba(255, 255, 255, 0.15);
}

/* Content */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* Grid & Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.card {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.kpi-card {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 20px;
}

.kpi-label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.kpi-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--gold);
  font-family: "JetBrains Mono", monospace;
}

.kpi-change {
  font-size: 12px;
  color: var(--success);
  margin-top: 8px;
}

/* Table */
.table-container {
  overflow-x: auto;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
  padding: 12px;
  text-align: left;
  font-weight: 600;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  text-transform: uppercase;
  font-size: 11px;
}

td {
  padding: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}

tr:hover {
  background: rgba(232, 177, 76, 0.06);
}

tr.clickable {
  cursor: pointer;
}

/* Status Pills */
.pill {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

.pill.lead { background: rgba(94, 156, 240, 0.2); color: #5e9cf0; }
.pill.application { background: rgba(232, 177, 76, 0.2); color: var(--gold); }
.pill.kyc { background: rgba(62, 201, 192, 0.2); color: #3ec9c0; }
.pill.documents { background: rgba(160, 139, 240, 0.2); color: #a08bf0; }
.pill.credit-bureau { background: rgba(240, 85, 106, 0.2); color: #f0556a; }
.pill.underwriting { background: rgba(67, 209, 127, 0.2); color: #43d17f; }
.pill.approval { background: rgba(62, 201, 192, 0.2); color: #3ec9c0; }
.pill.disbursement { background: rgba(232, 177, 76, 0.2); color: var(--gold); }

.pill.active { background: rgba(67, 209, 127, 0.2); color: #43d17f; }
.pill.closed { background: rgba(137, 149, 176, 0.2); color: #8995b0; }
.pill.npa { background: rgba(240, 85, 106, 0.2); color: #f0556a; }
.pill.delinquent { background: rgba(240, 165, 59, 0.2); color: #f0a53b; }

/* Modal */
#overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  z-index: 999;
}

#overlay.show {
  display: flex;
  align-items: center;
  justify-content: center;
}

#modalMount {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  padding: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-close {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 20px;
  padding: 0;
  width: 24px;
  height: 24px;
  line-height: 1;
}

.modal-body {
  padding: 20px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  margin-bottom: 16px;
  padding-bottom: 12px;
}

.tab {
  padding: 8px 0;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

.tab.active {
  border-bottom-color: var(--gold);
  color: var(--gold);
}

/* Toast */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--gold);
  color: var(--bg);
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  display: none;
  z-index: 1001;
  animation: slideIn 0.3s ease-out;
}

#toast.show {
  display: block;
}

@keyframes slideIn {
  from { transform: translateX(400px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Forms */
.form-group {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  font-weight: 600;
}

input, select, textarea {
  width: 100%;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
}

input::placeholder, textarea::placeholder {
  color: var(--muted);
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(232, 177, 76, 0.08);
}

/* Stage Track */
.stage-track {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.stage-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
}

.stage-dot.done { background: var(--success); }
.stage-dot.current { background: var(--gold); }

/* Helpers */
.flex { display: flex; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.muted { color: var(--muted); }
.mb-16 { margin-bottom: 16px; }
.mt-16 { margin-top: 16px; }

/* Charts (simple SVG style) */
.chart-container {
  margin-bottom: 20px;
}

svg {
  max-width: 100%;
  height: auto;
}

.chart-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
}

/* ---- Mobile (Phase 1): unfreeze the desktop flex shell, turn the fixed
   240px sidebar into a horizontal scrolling nav bar. ---- */
@media (max-width: 640px) {
  body { overflow: auto; }
  #app { flex-direction: column; height: auto; min-height: 100vh; }
  #sidebar {
    width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden;
    padding: 8px; gap: 4px; border-right: 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0; z-index: 20;
    background: var(--card2);
  }
  #sidebar .logo {
    padding: 0 14px; margin: 0; border-bottom: 0;
    display: flex; align-items: center; white-space: nowrap; flex: none;
  }
  .nav-item {
    border-left: 0; border-bottom: 3px solid transparent;
    padding: 10px 14px; white-space: nowrap; flex: none;
  }
  .nav-item.active { border-left-color: transparent; border-bottom-color: var(--gold); }
  .nav-badge { position: static; margin-left: 6px; display: inline-block; }
  #main { height: auto; }
  #topbar { flex-wrap: wrap; padding: 12px 16px; }
}
</style>
<link rel="stylesheet" href="../_shared/mobile.css">
<link rel="stylesheet" href="modern.css">
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand"><span class="brand-mark">LC</span><span class="brand-copy"><span class="brand-name">Lending Cloud</span><span class="brand-sub">Operations workspace</span></span></div>
    <div class="nav-section">My workspace</div>
    <div class="nav-item active" onclick="go('dashboard')"><span class="nav-icon">01</span>Command center</div>
    <div class="nav-section">Lending operations</div>
    <div class="nav-item" onclick="go('los')"><span class="nav-icon">02</span>Applications</div>
    <div class="nav-item" onclick="go('underwriting')"><span class="nav-icon">03</span>Decisions</div>
    <div class="nav-item" onclick="go('lms')"><span class="nav-icon">04</span>Active loans</div>
    <div class="nav-item" onclick="go('collections')"><span class="nav-icon">05</span>Collections <span class="nav-badge" id="navColBadge">0</span></div>
    <div class="nav-section">Intelligence</div>
    <div class="nav-item" onclick="go('customers')"><span class="nav-icon">06</span>Customers</div>
    <div class="nav-item" onclick="go('analytics')"><span class="nav-icon">07</span>Portfolio insights</div>
    <div class="nav-item" onclick="go('admin')"><span class="nav-icon">08</span>Controls & audit</div>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="topbar-context"><strong>West India Retail Lending</strong><span>Operational day: live</span></div>
      <input type="text" class="search-box" placeholder="Search customer, loan, app..." id="searchBox" onkeyup="state.search = this.value; render();">
      <div class="topbar-actions">
        <button onclick="newApplicationModal()">New application</button>
        <div class="user-chip"><span class="user-avatar">AK</span><span><strong>Arjun Khanna</strong>Operations lead</span></div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="overlay" onclick="if(event.target.id==='overlay') closeModal();"></div>
<div id="modalMount"></div>
<div id="toast"></div>

<script>
/* ============================================================
   LENDING CLOUD · CORE ENGINE
   Unified LOS + LMS + Collections + Analytics
   Pure client-side engine with deterministic demo data,
   workflow state machines, EMI math, and collections logic.
   ============================================================ */

const Engine = (() => {
  // ─────────────────────────────────────────────────────────
  // UTILITIES
  // ─────────────────────────────────────────────────────────
  const fmtINR = (n) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(n);
  const fmtINRk = (n) => {
    if (n >= 10000000) return (n / 10000000).toFixed(1) + ' Cr';
    if (n >= 100000) return (n / 100000).toFixed(1) + ' L';
    if (n >= 1000) return (n / 1000).toFixed(1) + ' K';
    return n.toString();
  };
  const pct = (p) => (p * 100).toFixed(1) + '%';
  const todayISO = () => new Date().toISOString().split('T')[0];
  const addDays = (date, days) => { const d = new Date(date); d.setDate(d.getDate() + days); return d.toISOString().split('T')[0]; };
  const daysBetween = (d1, d2) => Math.floor((new Date(d2) - new Date(d1)) / (1000 * 60 * 60 * 24));

  let _seed = 1337;
  const rng = () => { _seed = (_seed * 9301 + 49297) % 233280; return _seed / 233280; };
  const uid = () => 'id_' + Math.random().toString(36).substr(2, 9);
  const pick = (a) => a[Math.floor(rng() * a.length)];

  // ─────────────────────────────────────────────────────────
  // DATA
  // ─────────────────────────────────────────────────────────
  const FIRST_NAMES = ['Rajesh', 'Priya', 'Amit', 'Ananya', 'Vikram', 'Sneha', 'Rohan', 'Divya', 'Arjun', 'Neha'];
  const LAST_NAMES = ['Sharma', 'Patel', 'Kumar', 'Singh', 'Gupta', 'Desai', 'Nair', 'Rao', 'Verma', 'Joshi'];
  const CITIES = ['Mumbai', 'Delhi', 'Bangalore', 'Hyderabad', 'Chennai', 'Pune', 'Kolkata', 'Ahmedabad'];
  const PRODUCTS = [
    { id: 'pl', name: 'Personal Loan', minAmount: 100000, maxAmount: 5000000, rate: 13.5, maxTenure: 60 },
    { id: 'hl', name: 'Home Loan', minAmount: 1000000, maxAmount: 50000000, rate: 7.5, maxTenure: 240 },
    { id: 'al', name: 'Auto Loan', minAmount: 300000, maxAmount: 3000000, rate: 9.5, maxTenure: 84 },
    { id: 'bl', name: 'Business Loan', minAmount: 500000, maxAmount: 50000000, rate: 12.0, maxTenure: 120 },
    { id: 'gl', name: 'Gold Loan', minAmount: 50000, maxAmount: 2000000, rate: 10.5, maxTenure: 36 },
    { id: 'el', name: 'Education Loan', minAmount: 100000, maxAmount: 2000000, rate: 8.5, maxTenure: 120 }
  ];
  const STAGES = ['Lead', 'Application', 'KYC', 'Documents', 'Credit Bureau', 'Underwriting', 'Approval', 'Disbursement'];
  const EMPLOYMENT = ['Salaried', 'Self-Employed', 'Business Owner', 'Freelancer'];

  const DB = { customers: [], applications: [], loans: [], collections: [], audit: [] };

  // ─────────────────────────────────────────────────────────
  // EMI & AMORTIZATION
  // ─────────────────────────────────────────────────────────
  const computeEMI = (principal, annualRate, months) => {
    const monthlyRate = annualRate / 100 / 12;
    if (monthlyRate === 0) return Math.ceil(principal / months);
    return Math.ceil((principal * monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1));
  };

  const buildSchedule = (principal, annualRate, months, startDate) => {
    const emi = computeEMI(principal, annualRate, months);
    const schedule = [];
    let balance = principal;
    const monthlyRate = annualRate / 100 / 12;
    for (let i = 1; i <= months; i++) {
      const dueDate = addDays(startDate, i * 30);
      const interest = Math.ceil(balance * monthlyRate);
      const princ = Math.min(emi - interest, balance);
      balance = Math.max(0, balance - princ);
      schedule.push({
        no: i,
        dueDate,
        emi,
        principal: princ,
        interest,
        balance,
        status: 'Pending',
        paidDate: null
      });
    }
    return schedule;
  };

  // ─────────────────────────────────────────────────────────
  // SEEDED DATA GENERATION
  // ─────────────────────────────────────────────────────────
  const seed = () => {
    DB.customers = Array.from({ length: 60 }, (_, i) => ({
      id: 'cust_' + (i + 1),
      name: pick(FIRST_NAMES) + ' ' + pick(LAST_NAMES),
      email: `cust${i + 1}@email.com`,
      phone: '98' + String(7000000 + i).padStart(8, '0'),
      city: pick(CITIES),
      employment: pick(EMPLOYMENT),
      income: Math.floor(rng() * 1500000) + 300000,
      bureau_score: Math.floor(rng() * 250) + 550,
      createdAt: addDays(todayISO(), -Math.floor(rng() * 180))
    }));

    DB.applications = Array.from({ length: 28 }, (_, i) => {
      const product = pick(PRODUCTS);
      const amount = Math.floor(rng() * (product.maxAmount - product.minAmount) + product.minAmount);
      const months = Math.floor(rng() * product.maxTenure) + 12;
      return {
        id: 'app_' + (i + 1),
        customerId: pick(DB.customers).id,
        productId: product.id,
        productName: product.name,
        appliedAmount: amount,
        appliedRate: product.rate,
        appliedTenure: months,
        stage: pick(STAGES),
        decisionDate: null,
        decision: null,
        createdAt: addDays(todayISO(), -Math.floor(rng() * 90))
      };
    });

    DB.loans = Array.from({ length: 45 }, (_, i) => {
      const app = pick(DB.applications);
      const product = PRODUCTS.find(p => p.id === app.productId);
      const principal = app.appliedAmount;
      const rate = product.rate;
      const months = app.appliedTenure;
      const schedule = buildSchedule(principal, rate, months, addDays(todayISO(), -Math.floor(rng() * 120)));
      const delinquent = rng() > 0.78;
      const deepNpa = rng() > 0.93;
      return {
        id: 'loan_' + (i + 1),
        customerId: app.customerId,
        applicationId: app.id,
        productName: app.productName,
        principal,
        rate,
        emi: computeEMI(principal, rate, months),
        months,
        createdAt: addDays(todayISO(), -Math.floor(rng() * 180)),
        status: deepNpa ? 'NPA' : (delinquent ? 'Delinquent' : 'Active'),
        outstanding: Math.ceil(principal * (0.5 + rng() * 0.5)),
        schedule,
        paidInstallments: 0
      };
    });

    DB.collections = Array.from({ length: 15 }, (_, i) => ({
      id: 'col_' + (i + 1),
      loanId: pick(DB.loans).id,
      status: pick(['Open', 'Resolved', 'Escalated']),
      bucket: pick(['0-30', '30-60', '60-90', '90-180', '180+']),
      priority: pick(['Low', 'Medium', 'High']),
      lastActivity: addDays(todayISO(), -Math.floor(rng() * 30)),
      ptp: null,
      paidAmount: 0,
      notes: ''
    }));
  };

  seed();

  // ─────────────────────────────────────────────────────────
  // CREDIT & UNDERWRITING
  // ─────────────────────────────────────────────────────────
  const generateBureauScore = () => Math.floor(rng() * 250) + 550;

  const runUnderwriting = (app) => {
    const cust = DB.customers.find(c => c.id === app.customerId);
    const product = PRODUCTS.find(p => p.id === app.productId);
    const checks = [];
    let decision = 'AUTO-APPROVE';
    let riskGrade = 'A';

    if (cust.bureau_score < 600) { decision = 'DECLINE'; riskGrade = 'D'; checks.push('Low CIBIL'); }
    if (cust.income < product.minAmount * 5) { decision = 'REFER'; riskGrade = 'C'; checks.push('Low Income'); }
    if (app.appliedAmount > cust.income * 30) { decision = 'REFER'; riskGrade = 'B'; checks.push('High LTV'); }

    const foir = (product.maxAmount * product.rate / 100 / 12) / (cust.income / 12);
    const proposedEmi = computeEMI(app.appliedAmount, product.rate, app.appliedTenure);

    return {
      foir: foir.toFixed(2),
      proposedEmi,
      checks,
      decision,
      riskGrade,
      score: cust.bureau_score
    };
  };

  // ─────────────────────────────────────────────────────────
  // WORKFLOWS
  // ─────────────────────────────────────────────────────────
  const log = (action, entity, details) => DB.audit.push({ timestamp: new Date().toISOString(), action, entity, details });

  const advanceStage = (appId) => {
    const app = DB.applications.find(a => a.id === appId);
    if (!app) return { ok: false, msg: 'App not found' };
    const idx = STAGES.indexOf(app.stage);
    if (idx < STAGES.length - 1) { app.stage = STAGES[idx + 1]; log('STAGE_ADVANCE', appId, { to: app.stage }); return { ok: true, msg: `Advanced to ${app.stage}` }; }
    return { ok: false, msg: 'Already at final stage' };
  };

  const decideApplication = (appId, decision, riskGrade) => {
    const app = DB.applications.find(a => a.id === appId);
    if (!app) return { ok: false };
    app.decision = decision;
    app.decisionDate = todayISO();
    log('DECISION', appId, { decision, riskGrade });
    if (decision === 'APPROVE') app.stage = 'Approval';
    return { ok: true };
  };

  const disburse = (appId) => {
    const app = DB.applications.find(a => a.id === appId);
    if (!app || app.decision !== 'APPROVE') return { ok: false };
    const product = PRODUCTS.find(p => p.id === app.productId);
    const schedule = buildSchedule(app.appliedAmount, app.appliedRate, app.appliedTenure, todayISO());
    const loan = {
      id: 'loan_' + uid(),
      customerId: app.customerId,
      applicationId: app.id,
      productName: app.productName,
      principal: app.appliedAmount,
      rate: app.appliedRate,
      emi: computeEMI(app.appliedAmount, app.appliedRate, app.appliedTenure),
      months: app.appliedTenure,
      createdAt: todayISO(),
      status: 'Active',
      outstanding: app.appliedAmount,
      schedule,
      paidInstallments: 0
    };
    DB.loans.push(loan);
    app.stage = 'Disbursement';
    log('DISBURSE', appId, { loanId: loan.id, amount: app.appliedAmount });
    return { ok: true, loanId: loan.id };
  };

  const payEmi = (loanId) => {
    const loan = DB.loans.find(l => l.id === loanId);
    if (!loan) return { ok: false };
    const paidPrincipal = loan.schedule
      .filter(s => s.status === 'Paid')
      .reduce((sum, s) => sum + s.principal, 0);
    const outstanding = loan.principal - paidPrincipal;
    const nextPending = loan.schedule.find(s => s.status === 'Pending');
    if (nextPending) {
      nextPending.status = 'Paid';
      nextPending.paidDate = todayISO();
      loan.paidInstallments += 1;
      log('PAY_EMI', loanId, { emi: nextPending.emi, outstanding: outstanding - nextPending.principal });
      return { ok: true, msg: `EMI ₹${fmtINRk(nextPending.emi)} paid` };
    }
    return { ok: false, msg: 'No pending EMI' };
  };

  const recordRecovery = (collectionId, amount) => {
    const col = DB.collections.find(c => c.id === collectionId);
    if (!col) return { ok: false };
    col.paidAmount += amount;
    col.status = col.paidAmount >= 10000 ? 'Resolved' : 'Open';
    log('RECOVERY', collectionId, { amount });
    return { ok: true };
  };

  const foreclose = (loanId) => {
    const loan = DB.loans.find(l => l.id === loanId);
    if (!loan) return { ok: false };
    loan.status = 'Closed';
    log('FORECLOSE', loanId, {});
    return { ok: true };
  };

  const restructure = (loanId, newMonths) => {
    const loan = DB.loans.find(l => l.id === loanId);
    if (!loan) return { ok: false };
    const newEmi = computeEMI(loan.outstanding, loan.rate, newMonths);
    log('RESTRUCTURE', loanId, { newMonths, newEmi });
    return { ok: true, newEmi };
  };

  const logActivity = (collectionId, activity) => {
    const col = DB.collections.find(c => c.id === collectionId);
    if (!col) return { ok: false };
    col.notes += '\n' + activity;
    col.lastActivity = todayISO();
    log('ACTIVITY', collectionId, { activity });
    return { ok: true };
  };

  const setPTP = (collectionId, promiseDate) => {
    const col = DB.collections.find(c => c.id === collectionId);
    if (!col) return { ok: false };
    col.ptp = promiseDate;
    log('SET_PTP', collectionId, { date: promiseDate });
    return { ok: true };
  };

  // ─────────────────────────────────────────────────────────
  // ANALYTICS
  // ─────────────────────────────────────────────────────────
  const analytics = () => {
    const book = DB.loans.reduce((sum, l) => sum + l.principal, 0);
    const npaCount = DB.loans.filter(l => l.status === 'NPA').length;
    const delinqCount = DB.loans.filter(l => l.status === 'Delinquent').length;
    const npaPct = DB.loans.length ? (npaCount / DB.loans.length * 100) : 0;
    const appsByStage = {};
    STAGES.forEach(s => { appsByStage[s] = DB.applications.filter(a => a.stage === s).length; });
    const byProduct = {};
    PRODUCTS.forEach(p => { byProduct[p.name] = DB.loans.filter(l => l.productName === p.name).length; });

    return {
      book,
      bookFormatted: fmtINRk(book),
      npaPct: npaPct.toFixed(1),
      npaCount,
      delinqCount,
      activeCount: DB.loans.filter(l => l.status === 'Active').length,
      closedCount: DB.loans.filter(l => l.status === 'Closed').length,
      appsByStage,
      byProduct,
      avgPrincipal: DB.loans.length ? Math.floor(book / DB.loans.length) : 0,
      totalCustomers: DB.customers.length,
      totalApps: DB.applications.length,
      totalLoans: DB.loans.length
    };
  };

  // ─────────────────────────────────────────────────────────
  // PUBLIC API
  // ─────────────────────────────────────────────────────────
  return {
    init: () => { _seed = 1337; },
    db: DB,
    computeEMI,
    fmtINR,
    fmtINRk,
    pct,
    todayISO,
    advanceStage,
    decideApplication,
    disburse,
    payEmi,
    recordRecovery,
    foreclose,
    restructure,
    logActivity,
    setPTP,
    runUnderwriting,
    analytics,
    customer: (id) => DB.customers.find(c => c.id === id),
    loansForCustomer: (id) => DB.loans.filter(l => l.customerId === id),
    appsForCustomer: (id) => DB.applications.filter(a => a.customerId === id)
  };
})();

              <td><span class="pill ${s.status.toLowerCase()}">${s.status}</span></td>

        <button class="secondary" onclick="doRestructure('${loanId}')">Restructure</button>
      </div>
    </div>
  `;
  openModal(html);
}

function doPayEmi(loanId) {
  const res = E.payEmi(loanId);

  render();
  closeModal();
}

function doForeclose(loanId) {
  const res = E.foreclose(loanId);
  toast(res.ok ? 'Loan foreclosed' : 'Error');
  render();
  closeModal();
}

function doRestructure(loanId) {

        <button class="secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  `;
  openModal(html);
}

function confirmRestructure(loanId) {
  const newMonths = parseInt($('#newMonths').value);
  const res = E.restructure(loanId, newMonths);
  toast(res.ok ? `New EMI: ${E.fmtINR(res.newEmi)}` : 'Error');
  render();
  closeModal();
}

function viewCollections() {
  const cases = E.db.collections.filter(c => state.search ? E.loansForCustomer(E.db.loans.find(l => l.id === c.loanId)?.customerId).length > 0 : true);

  const html = `
    ${pageHeader('Collections', 'Prioritize delinquent accounts and track recovery commitments.')}

      <div class="kpi-card">
        <div class="kpi-label">Open Cases</div>
        <div class="kpi-value">${cases.filter(c => c.status === 'Open').length}</div>
      </div>

      <table>

function workCaseModal(caseId) {
  const col = E.db.collections.find(c => c.id === caseId);
  const loan = E.db.loans.find(l => l.id === col.loanId);
  const cust = E.customer(loan.customerId);

  const html = `
    <div class="modal-header">
      <h3>Work Case - ${cust.name}</h3>
      <span class="modal-close" onclick="closeModal()">×</span>

    <div class="modal-body">

        <label>Status</label>

      </div>
      <div class="form-group">
        <label>Bucket</label>
        <input type="text" readonly value="${col.bucket}">
      </div>
      <div class="form-group">
        <label>Outstanding</label>
        <input type="text" readonly value="${E.fmtINR(loan.outstanding)}">
      </div>
      <div class="form-group">
        <label>Recovered</label>
        <input type="text" readonly value="${E.fmtINR(col.paidAmount)}">
      </div>

      <div class="chart-title" style="margin: 20px 0 12px;">Log Activity</div>
      <div class="form-group">
        <select id="actType">

          <option>Email</option>

        <button class="secondary" onclick="ptpForm('${caseId}')">Set PTP</button>

      <div style="background: rgba(255,255,255,0.04); padding: 12px; border-radius: 6px; font-size: 11px; color: #8892a6; max-height: 200px; overflow-y: auto;">

  openModal(html);
}

function logAct(caseId) {
  const type = $('#actType').value;
  E.logActivity(caseId, `${type} logged on ${E.todayISO()}`);
  toast('Activity logged');
  render();
  workCaseModal(caseId);
}

function doRecover(caseId) {
  const amt = parseInt(prompt('Amount recovered:', '5000'));
  if (!isNaN(amt)) {
    const res = E.recordRecovery(caseId, amt);
    toast(res.ok ? `₹${E.fmtINRk(amt)} recorded` : 'Error');
    render();
    workCaseModal(caseId);
  }
}

  closeModal();
}

function viewAnalytics() {
  const an = E.analytics();
  const riskGrades = { 'A': 0, 'B': 0, 'C': 0, 'D': 0 };
  E.db.applications.forEach(a => {
    if (a.decision === 'APPROVE') riskGrades['A']++;
    else if (a.decision === 'REFER') riskGrades['B']++;
    else if (a.decision === 'DECLINE') riskGrades['C']++;
  });

  const html = `
    ${pageHeader('Portfolio insights', 'Track growth, credit quality, and operational performance.')}
    <div class="grid mb-16">
      <div class="kpi-card">
        <div class="kpi-label">Total Book</div>
        <div class="kpi-value">${an.bookFormatted}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">NPA %</div>
        <div class="kpi-value">${an.npaPct}%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Delinquent</div>
        <div class="kpi-value">${an.delinqCount}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Active Loans</div>
        <div class="kpi-value">${an.activeCount}</div>
      </div>
    </div>

    <div class="card mb-16">
      <div class="chart-title">Loan Status Distribution</div>
      <div class="flex gap-16 items-center" style="overflow-x: auto; padding: 16px 0;">
        ${[['Active', an.activeCount, '#43d17f'], ['Delinquent', an.delinqCount, '#f0a93b'], ['NPA', an.npaCount, '#f0556a'], ['Closed', an.closedCount, '#8995b0']].filter(([, c]) => c > 0).map(([name, count, color]) => `
          <div style="flex: 1; min-width: 100px; text-align: center;">
            <div style="background: ${color}; height: ${(count / Math.max(an.activeCount, an.delinqCount, an.npaCount, an.closedCount || 1)) * 150}px; border-radius: 6px; margin-bottom: 8px;"></div>
            <div style="font-size: 11px; color: #8892a6;">${name}</div>
            <div style="font-size: 14px; font-weight: 600; color: #f0f4f8;">${count}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="chart-title">Underwriting Approvals</div>
      <div style="display: flex; gap: 20px; padding: 16px 0;">
        ${[['Grade A', riskGrades['A'], '#43d17f'], ['Grade B', riskGrades['B'], '#3ec9c0'], ['Grade C', riskGrades['C'], '#f0a93b']].map(([name, count, color]) => `
          <div style="flex: 1; text-align: center;">
            <div style="width: 80px; height: 80px; border-radius: 50%; background: ${color}; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px;">${count}</div>
            <div style="font-size: 12px; color: #8892a6;">${name}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  $('#content').innerHTML = html;
}

function newApplicationModal(presetCust) {
  const html = `
    <div class="modal-header">

    </div>
    <div class="modal-body">
      <div class="form-group">

          ${E.db.customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}

      </div>
      <div class="form-group">
        <label>Product</label>
        <select id="prodSelect" onchange="updateLoanPreview()">
          <option value="">-- Select --</option>
          <option value="pl">Personal Loan</option>
          <option value="hl">Home Loan</option>
          <option value="al">Auto Loan</option>
          <option value="bl">Business Loan</option>
          <option value="gl">Gold Loan</option>
          <option value="el">Education Loan</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount</label>
        <input type="number" id="amtInput" oninput="updateLoanPreview()" value="500000">
      </div>
      <div class="form-group">
        <label>Tenure (months)</label>
        <input type="number" id="tenInput" oninput="updateLoanPreview()" value="60">
      </div>
      <div style="background: rgba(232,177,76,0.1); border-left: 3px solid #e8b14c; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
        <div style="font-size: 11px; color: #8892a6; margin-bottom: 4px;">ESTIMATED EMI</div>
        <div style="font-size: 20px; font-weight: 700; color: #e8b14c;" id="emiPreview">₹0</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button onclick="createApp()">Create</button>
        <button class="secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  `;
  openModal(html);
}

function updateLoanPreview() {
  const prodId = $('#prodSelect').value;
  const amt = parseInt($('#amtInput').value) || 500000;
  const ten = parseInt($('#tenInput').value) || 60;
  const prod = E.db.applications[0] ? { rate: 12 } : { rate: 12 };
  const rates = { pl: 13.5, hl: 7.5, al: 9.5, bl: 12, gl: 10.5, el: 8.5 };
  const emi = E.computeEMI(amt, rates[prodId] || 12, ten);
  $('#emiPreview').textContent = E.fmtINR(emi);
}

function createApp() {
  const custId = $('#custSelect').value;
  const prodId = $('#prodSelect').value;
  const amt = parseInt($('#amtInput').value);
  const ten = parseInt($('#tenInput').value);

  if (!custId || !prodId) {
    toast('Fill all fields');
    return;
  }

  const prodMap = { pl: 'Personal Loan', hl: 'Home Loan', al: 'Auto Loan', bl: 'Business Loan', gl: 'Gold Loan', el: 'Education Loan' };
  const rates = { pl: 13.5, hl: 7.5, al: 9.5, bl: 12, gl: 10.5, el: 8.5 };

  E.db.applications.push({
    id: 'app_' + uid(),
    customerId: custId,
    productId: prodId,
    productName: prodMap[prodId],
    appliedAmount: amt,
    appliedRate: rates[prodId],
    appliedTenure: ten,
    stage: 'Lead',
    decisionDate: null,
    decision: null,
    createdAt: E.todayISO()
  });

  toast('Application created');
  render();
  closeModal();
}

render();
