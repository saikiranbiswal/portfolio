<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Papercraft · Local PDF Editor | Sai Kiran Biswal</title>
  <meta name="description" content="Edit, remove, highlight, redact, and export PDFs locally in your browser with Papercraft.">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#edf2f8;color:#111827}.boot{height:100%;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);padding:34px;border:1px solid #dbe3ee;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.14);text-align:center}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,#3182f6,#5a5ef0);position:relative}.mark:after{content:"";position:absolute;width:31px;height:8px;left:16px;top:28px;border-radius:4px;background:#fff;transform:rotate(-45deg)}h1{margin:0 0 8px;font-size:24px}p{margin:0;color:#667085;line-height:1.6;font-size:13px}.error{color:#b42318;margin-top:14px;font-weight:700}.retry{display:none;margin:18px auto 0;padding:10px 14px;border:0;border-radius:10px;background:#4f67f6;color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="boot">
    <section class="card" aria-live="polite">
      <div class="mark" aria-hidden="true"></div>
      <h1>Loading Papercraft</h1>
      <p>Preparing the local PDF editor…</p>
      <div class="error" id="error"></div>
      <button class="retry" id="retry" type="button">Retry</button>
    </section>
  </main>
  <script>
    async function loadPapercraft(){
      const error=document.getElementById('error');
      const retry=document.getElementById('retry');
      error.textContent='';retry.style.display='none';
      try{
        if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support the required decompression API. Please use a current version of Chrome, Edge, Firefox, or Safari.');
        const response=await fetch('./app-v4.gz.b64?v=4',{cache:'no-store'});
        if(!response.ok) throw new Error('Papercraft could not be loaded from GitHub Pages.');
        const base64=(await response.text()).trim();
        const binary=Uint8Array.from(atob(base64),character=>character.charCodeAt(0));
        const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        document.open();document.write(html);document.close();
      }catch(loadError){
        console.error(loadError);error.textContent=loadError.message||'Papercraft failed to load.';retry.style.display='inline-flex';
      }
    }
    document.getElementById('retry').addEventListener('click',loadPapercraft);
    loadPapercraft();
  </script>
</body>
</html>
