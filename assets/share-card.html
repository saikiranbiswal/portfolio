<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background:
      radial-gradient(120% 120% at 82% -10%, #16284b 0%, #070b14 52%, #03060d 100%);
    color: #f4f1ea;
    font-family: 'Inter', -apple-system, Helvetica, Arial, sans-serif;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .glyph {
    width: 58px; height: 58px; border-radius: 50%;
    background: #f4f1ea; color: #070b14;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; letter-spacing: -1px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 21px; letter-spacing: 4px; text-transform: uppercase;
    color: #c98a5e; font-weight: 500;
  }
  h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 500; font-size: 92px; line-height: 1.0;
    letter-spacing: -2px; margin: 22px 0 0;
  }
  h1 em { font-style: italic; color: #e0936a; }
  .sub { font-size: 30px; color: #9ba7b8; margin-top: 26px; max-width: 22ch; line-height: 1.35; }
  .foot { display: flex; align-items: center; gap: 14px; font-size: 22px; color: #c4ccd8; }
  .pulse { width: 12px; height: 12px; border-radius: 50%; background: #c98a5e; }
  .top { display: flex; align-items: center; gap: 18px; }
  .name-line { font-size: 24px; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <div class="glyph">SK</div>
    <div class="name-line">Sai Kiran Biswal</div>
  </div>
  <div>
    <p class="eyebrow">Enterprise AI · Fintech · Product</p>
    <h1>Products built from<br><em>problem</em> to proof.</h1>
    <p class="sub">Working products, flagship case studies, and the evidence behind them.</p>
  </div>
  <div class="foot"><span class="pulse"></span> Product Manager · Open to lead PM roles</div>
</body>
</html>
