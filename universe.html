<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saikiran Biswal · Product Portfolio</title>
<meta name="description" content="Saikiran Biswal product portfolio — enterprise SaaS, AI workflow automation, and independent product builds.">
<style>
:root{--bg:#0d1610;--panel:rgba(13,22,16,.94);--ink:#eef4ee;--muted:#9dac9f;--line:rgba(238,244,238,.13);--sage:#6ba87a;--gold:#dba94a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.launcher{height:92px;display:flex;align-items:center;gap:16px;padding:12px 18px max(12px,env(safe-area-inset-bottom));background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);position:relative;z-index:10}
.brand{flex:0 0 auto;min-width:150px}.brand b{display:block;font-size:14px;letter-spacing:-.01em}.brand span{display:block;margin-top:4px;color:var(--sage);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.products{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;flex:1;padding:2px}.products::-webkit-scrollbar{display:none}
.card{min-width:max-content;display:flex;align-items:center;gap:9px;padding:10px 13px;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;background:rgba(255,255,255,.035);transition:.18s ease}.card:hover,.card:focus-visible{border-color:rgba(107,168,122,.55);background:rgba(107,168,122,.10);transform:translateY(-1px);outline:none}.num{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:rgba(107,168,122,.14);color:var(--sage);font-size:10px;font-weight:800}.copy strong{display:block;font-size:12px;line-height:1.15}.copy small{display:block;color:var(--muted);font-size:9px;margin-top:3px;letter-spacing:.02em}.hint{flex:0 0 auto;color:var(--muted);font-size:10px;line-height:1.35;text-align:right}.stage{position:absolute;left:0;right:0;top:92px;bottom:0}.stage iframe{border:0;width:100%;height:100%;display:block;background:#fbfaf6}
@media(max-width:760px){.launcher{height:112px;display:block;padding:10px 12px}.brand{display:flex;align-items:baseline;gap:8px;min-width:0;margin-bottom:8px}.brand span{margin-top:0}.products{width:100%}.card{padding:8px 10px}.hint{display:none}.stage{top:112px}.copy strong{font-size:11px}}
</style>
</head>
<body>
<header class="launcher" aria-label="Latest portfolio builds">
  <div class="brand"><b>Latest builds</b><span>New in portfolio</span></div>
  <nav class="products">
    <a class="card" href="apps/documentops-ai/index.html"><span class="num">01</span><span class="copy"><strong>DocumentOps AI V2</strong><small>Enterprise document operations</small></span></a>
    <a class="card" href="apps/channelops/index.html"><span class="num">02</span><span class="copy"><strong>ChannelOps</strong><small>DMS + SFA Command Center</small></span></a>
    <a class="card" href="apps/house-quotation-copilot/index.html"><span class="num">03</span><span class="copy"><strong>House Quotation Copilot v4.2</strong><small>Governed quoting + WhatsApp path</small></span></a>
    <a class="card" href="apps/roamradio/index.html"><span class="num">04</span><span class="copy"><strong>RoamRadio</strong><small>Travel-first internet radio PWA</small></span></a>
  </nav>
  <div class="hint">Your immersive portfolio<br>continues below</div>
</header>
<main class="stage"><iframe src="universe-legacy.html" title="Saikiran Biswal immersive portfolio" allow="autoplay; fullscreen"></iframe></main>
</body>
</html>
